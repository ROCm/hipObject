# CodeQL configuration
# Reference: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
#
# The query suite itself is selected by the `queries:` input in
# .github/workflows/codeql.yml. This file only filters the results.

query-filters:
  # Flags the argv[++i] idiom used to consume an option's value in
  # hand-rolled command-line parsers. Every such use here is guarded by
  # an i + 1 < argc check, so the alert is noise.
  - exclude:
      id: cpp/loop-variable-changed
  # Style-only check that flags global variables with very short names.
  - exclude:
      id: cpp/short-global-name
  # Unused variables are already diagnosed by the compilers (-Wall and
  # -Wunused), which see the real build configuration. CodeQL runs with
  # build-mode: none, so its view of what is used is less reliable.
  - exclude:
      id: cpp/unused-static-variable
