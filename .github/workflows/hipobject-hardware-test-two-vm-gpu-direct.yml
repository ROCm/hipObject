#
# Two-VM GPU-buffer/host-buffer integration test
# (v1 protocol, asymmetric guests).
#
# The single-VM AIS lane puts both emulated functions -- ernic's NIC and
# rocjitsu's GPU -- in one guest and talks to rocm-ernic's own in-process S3
# store. This lane splits them across two guests instead, which is the shape
# a real deployment has: a client host with a GPU, a storage host without
# one, and an RDMA fabric between them.
#
#   VM 1 (192.168.200.10): ernic NIC only. hipobj-rdma-test-server, v1, :9000.
#   VM 2:                  ernic NIC + rocjitsu's emulated gfx1250, and
#                          minio-getput-rdma driving either a real hipMalloc'd
#                          device buffer or an explicit host buffer across the
#                          wire to VM 1.
#
# So the GPU is on one side of the transfer and not the other, and the bytes
# cross an emulated fabric rather than a loopback inside one process. Nothing
# else in the matrix covers that: Two-VM Protocol is two guests with host
# buffers, while the single-VM AIS lane is one guest. This workflow runs the
# asymmetric topology in both host-buffer and device-buffer modes.
#
# Two rocm-ernic instances on the runner, joined by a tcp:manager /
# tcp:worker mesh and each bridged onto ernicbr0 through its own tap, serve
# the NIC function apiece; rocjitsu runs as a sibling container and serves
# VM 2's second vfio-user socket. ip_discovery.bin is generated at job time
# from the same rocjitsu build that serves the socket -- it describes the
# device, so it cannot come from anywhere else.

name: hipObject - Hardware Test - Two-VM AIS and Host Buffers

on:
  # PR-gated and manual only. Nothing reaches develop without passing
  # this on the PR, so a second post-merge run would buy nothing but
  # queue time.
  #
  # The paths are what this lane builds and runs, so a change it cannot
  # observe doesn't spend VM time. Unit, header and install tests,
  # examples, the BNXT provider (built OFF here), docs, Clang options
  # (this lane builds with GCC), and the CMake modules for packaging or
  # opt-in tooling never reach this lane's binaries; other lanes cover
  # them. Negations must come last: the last pattern a file matches
  # decides whether it counts.
  pull_request:
    branches: [develop]
    paths:
      - "CMakeLists.txt"
      - "cmake/HIPOBJAddExecutable.cmake"
      - "cmake/HIPOBJAddLibraries.cmake"
      - "cmake/HIPOBJCompilerOptions.cmake"
      - "cmake/HIPOBJFortifySource.cmake"
      - "cmake/HIPOBJGNUCompilerOptions.cmake"
      - "cmake/HIPOBJMinioCppDeps.cmake"
      - "cmake/HIPOBJSystemIncludes.cmake"
      - "cmake/HIPOBJUseROCmCMake.cmake"
      - "cmake/minio-deps/**"
      - "include/**"
      - "integrations/minio-cpp/**"
      - "shared/**"
      - "src/**"
      - "test/CMakeLists.txt"
      - "test/integration/CMakeLists.txt"
      - "test/integration/rdma-test-server/**"
      - "ci/ernic/assert-transfer.sh"
      - "ci/ernic/client-entrypoint.sh"
      - "ci/ernic/server-entrypoint.sh"
      - ".github/actions/fetch-guest-vm/**"
      - ".github/workflows/hipobject-hardware-test-two-vm-gpu-direct.yml"
      - "!src/rdma/bnxt/**"
      - "!test/integration/rdma-test-server/run-v2-e2e.sh"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump these intentionally when the ernic or rocjitsu images are updated.
  # ERNIC_IMAGE: ernic.0b48aa1, the build whose rocm-ernic carries the s3
  #   backend. Every tag here is the date-prefixed, content-versioned one
  #   (<date>.<repo-sha>-<component>.<sha>-vfu.<sha>): immutable, so a rebuild
  #   cannot change what this lane tests underneath it.
  ERNIC_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244
  # ROCJITSU_IMAGE_GPU: the tag qemu-minimal's ernic-rocjitsu lane runs.
  #   ip_discovery.bin must come from whichever rocjitsu build serves the
  #   socket, and this lane generates it from this image, so the two cannot
  #   drift apart.
  ROCJITSU_IMAGE_GPU: sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260924.gad7a357-rocjitsu.c85bb75
  ROCM_IMAGE: rocm/dev-ubuntu-24.04:10.0.0-full

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  two-vm-gpu-direct:
    name: Two-VM RDMA (${{ matrix.buffer_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - buffer_label: GPU Buffer
            gpu_mode: gpu
            allow_failure: true
          - buffer_label: Host Buffer
            gpu_mode: nogpu
            allow_failure: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The previous container topology could not work and was gated off: with
    # no VM in the picture the container's /sys/class/infiniband stays empty,
    # so HIPOBJ_NIC_HINT=ernic0 never resolved. The missing piece was the
    # guest, not the image tag. This is that topology, taken from rocm-ernic's
    # own system-test-two-vms lane: two emulated NICs on one bridge, one
    # guest per NIC, hipObject's v1 server in the first and the minio-cpp
    # bridge client in the second.
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      # /dev/net/tun and NET_ADMIN are as load-bearing as /dev/kvm: without
      # them ionic_eth_net_send() has no fd and every guest frame is dropped,
      # which looks exactly like a healthy-but-silent link.
      options: --device /dev/kvm --device /dev/net/tun --cap-add=NET_ADMIN
    env:
      GUEST_ARTIFACT_REPO: docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ernic-rocjitsu
      GUEST_ARTIFACT_TAG: 20260925.g4868a2e-vm.resolute-ernic-rocjitsu-qm.e73a1e6-qcow2
      ERNIC_TAP_PREFIX: ernic-tap
      ERNIC_TAP_BRIDGE: ernicbr0
      TCP_PORT: 18515
      VM1_SSH_PORT: 2222
      VM2_SSH_PORT: 2223
      # ernic_guest_setup derives guest addresses as <subnet>.<10 * index>.
      VM1_ADDR: 192.168.200.10
      SERVER_PORT: 9000
      TEST_SIZE: 1048576

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout rocm-ernic (Ansible collection + guest driver sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ROCm/rocm-ernic
          ref: develop
          path: rocm-ernic
          persist-credentials: false

      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq iproute2 sudo libibverbs1 libnl-3-200 \
            libnl-route-3-200 ansible python3-jmespath
          for attempt in 1 2 3; do
            ansible-galaxy collection install community.general && break
            echo "::warning::galaxy install failed (attempt ${attempt}/3)"
            sleep $((attempt * 20))
          done

      - name: Build hipObject binaries (ROCm container)
        run: |
          # Stage what the binaries load at run time in rocm-libs, which
          # travels to the guest VMs with them: the ROCm libraries,
          # pugixml, and the shared libhipobj. In this container the
          # binaries' build-tree run path still finds libhipobj in
          # /hipobject-build/src, so the check treats that as unstaged.
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev \
                nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target hipobj-rdma-test-server minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              export LD_LIBRARY_PATH=/opt/rocm/lib && \
              for b in /hipobject-build/test/integration/rdma-test-server/hipobj-rdma-test-server \
                       /hipobject-build/integrations/minio-cpp/minio-getput-rdma; do \
                ldd \$b \
                  | awk '/=> \//{print \$3}' \
                  | grep -E '^/opt/(rocm|amdgpu)|/libpugixml\.so|/libhipobj\.so' \
                  | xargs -r -I{} cp -L {} /hipobject-build/rocm-libs/; \
              done && \
              for b in /hipobject-build/test/integration/rdma-test-server/hipobj-rdma-test-server \
                       /hipobject-build/integrations/minio-cpp/minio-getput-rdma; do \
                if LD_LIBRARY_PATH=/hipobject-build/rocm-libs ldd \$b \
                     | grep -E 'not found|=> /hipobject-build/src/'; then \
                  echo 'staged closure incomplete'; exit 1; \
                fi; \
              done && \
              echo 'staged closure complete'
            "

      - name: Extract rocm-ernic binary from ernic image
        run: |
          docker create --name ernic-tmp-2vm "$ERNIC_IMAGE"
          # Not the workspace: it is mounted noexec in the job container.
          docker cp ernic-tmp-2vm:/usr/local/bin/rocm-ernic /usr/local/bin/rocm-ernic
          docker rm ernic-tmp-2vm
          chmod +x /usr/local/bin/rocm-ernic
          rocm-ernic --help > /tmp/ernic-help.txt
          head -3 /tmp/ernic-help.txt

      - name: Generate ip_discovery.bin on the host
        run: |
          # The only firmware the guest does not bake, because it is the only
          # piece that is not static: it describes the device the socket
          # serves, so it must come from the rocjitsu build serving it. The
          # gap stubs are in /lib/firmware/updates/amdgpu already.
          mkdir -p "${GITHUB_WORKSPACE}/rj-fw"
          chmod 777 "${GITHUB_WORKSPACE}/rj-fw"
          docker run --rm -v "${{ github.workspace }}/rj-fw:/out" \
            "$ROCJITSU_IMAGE_GPU" \
            rj-ip-discovery gfx1250 /out/ip_discovery.bin
          ls -l "${GITHUB_WORKSPACE}/rj-fw"

      - name: Start the rocjitsu GPU server for VM 2
        run: |
          # rocjitsu runs as a sibling container, so its socket has to live on
          # a path the host daemon can bind-mount AND this container can see.
          # ${{ github.workspace }} is the host path; $GITHUB_WORKSPACE is the
          # same directory as mounted in here. The ernic sockets need neither,
          # since rocm-ernic runs in this container.
          mkdir -p "${GITHUB_WORKSPACE}/vfu"
          chmod 777 "${GITHUB_WORKSPACE}/vfu"
          docker run -d --name rocjitsu-2vm \
            -v "${{ github.workspace }}/vfu:/run/vfu" \
            "$ROCJITSU_IMAGE_GPU" \
            rocjitsu --config /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json \
                     --vfio-socket /run/vfu/rocjitsu.sock
          for _ in $(seq 1 45); do
            [ -S "${GITHUB_WORKSPACE}/vfu/rocjitsu.sock" ] && break
            sleep 2
          done
          [ -S "${GITHUB_WORKSPACE}/vfu/rocjitsu.sock" ] || {
            echo "rocjitsu.sock never appeared"; docker logs rocjitsu-2vm || true; exit 1; }
          chmod 666 "${GITHUB_WORKSPACE}/vfu/rocjitsu.sock" || true
          echo "rocjitsu socket present"

      - name: Select QEMU accelerator and guest size
        run: |
          if [ -c /dev/kvm ] && "${QEMU_PATH:-}qemu-system-x86_64" -accel help 2>/dev/null | grep -qw kvm; then
            echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
            echo "QEMU_CPU=host"  >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg"  >> "$GITHUB_ENV"
            echo "QEMU_CPU=qemu64" >> "$GITHUB_ENV"
          fi
          HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          # IONIC_EQ_COUNT_MIN is 4: a guest with fewer online CPUs can never
          # register the ibdev, so 4 is a floor and not a preference, even
          # when that means oversubscribing the runner.
          VM_VCPUS=$(( ($(nproc) - 1) / 2 )); [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
          VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / 2 ))
          [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024
          # 6144 to match the single-VM GPU lane, not 4096. A 16 GB runner puts
          # this formula at ~5996, and the old 4096 ceiling cut it to exactly
          # the size where the 1 MiB device-buffer transfer is a coin flip:
          # measured on the two-guest lab, 4096 MB gives 6 pass / 7 fail while
          # 5996 and 6144 give 8/8 and 32768 gives 9/9. The underlying resource
          # bug is still open -- a failed run leaks ~61 MB of VRAM and the next
          # one alternates back to passing -- so this buys headroom rather than
          # fixing it. The ceiling now only binds on hosts above 16 GB.
          [ "$VM_MEM_MB" -gt 6144 ] && VM_MEM_MB=6144
          echo "VM_VCPUS=$VM_VCPUS"   >> "$GITHUB_ENV"
          echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"
          echo "guest size: ${VM_VCPUS} vCPU, ${VM_MEM_MB} MB (host ${HOST_MEM_MB} MB)"

      - name: Fetch guest VM image
        id: guest_image
        uses: $/.github/actions/fetch-guest-vm
        with:
          repo: ${{ env.GUEST_ARTIFACT_REPO }}
          tag: ${{ env.GUEST_ARTIFACT_TAG }}

      - name: Read VM info
        id: vm_info
        env:
          GUEST_OUTPUT_DIR: ${{ steps.guest_image.outputs.output_dir }}
        run: |
          OUT="${GUEST_OUTPUT_DIR}"
          eval "$(python3 - "$OUT" <<'PYEOF'
          import json, os, shlex, sys
          out = sys.argv[1]
          d = json.load(open(os.path.join(out, "vm-info.json")))
          here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
          keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
          }
          for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
          PYEOF
          )"
          chmod 600 "$SSH_KEY_PRIVATE"
          {
            echo "vm_user=$VM_USER"
            echo "vm_disk=$VM_DISK"
            echo "ssh_key=$SSH_KEY_PRIVATE"
          } >> "$GITHUB_OUTPUT"

      - name: Create the per-VM disk overlays
        id: overlays
        env:
          VM_DISK: ${{ steps.vm_info.outputs.vm_disk }}
        run: |
          # Overlays, not copies. Both VMs get one including the first: with
          # VM 1 writing to the base directly, VM 2's backing file would
          # mutate underneath it.
          BASE="${VM_DISK}"
          STEM="$(dirname "$BASE")/$(basename "$BASE" .qcow2)"
          for n in 1 2; do
            DISK="${STEM}.${n}.qcow2"
            rm -f "$DISK"
            qemu-img create -f qcow2 -F qcow2 -b "$BASE" "$DISK" > /dev/null
            echo "vm_disk_${n}=$DISK" >> "$GITHUB_OUTPUT"
            qemu-img info "$DISK" | head -4
          done

      - name: Create the host bridge and per-instance TAPs
        run: |
          # ernic_host_setup owns this; run the role rather than open-coding
          # `ip tuntap`. Order matters -- rocm-ernic treats a missing --tap
          # as a startup failure, so the interfaces have to exist first.
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          ansible-playbook playbooks/host-setup.yml \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_build=false \
            -e ernic_install_service=false \
            -e ernic_gpu_passthrough=false \
            -e ernic_instances=2 \
            -e ernic_tap_owner=root \
            -e ernic_tap_bridge="${ERNIC_TAP_BRIDGE}" \
            -e ernic_tap_prefix="${ERNIC_TAP_PREFIX}"
          ip -o link show "${ERNIC_TAP_BRIDGE}"
          for n in 1 2; do ip -o link show "${ERNIC_TAP_PREFIX}${n}"; done

      - name: Start the two rocm-ernic instances
        run: |
          # --backend is the RDMA data path, --tap the Ethernet one; both are
          # needed. --mac is not optional once two instances share a bridge:
          # the emulator's built-in address is a constant, so without it both
          # guests come up on the same MAC and ARP can never resolve.
          for n in 1 2; do rm -f "/tmp/vfio-user-server${n}.sock"; done

          rocm-ernic \
            --socket /tmp/vfio-user-server1.sock \
            --backend "tcp:manager:listen:${TCP_PORT}" \
            --tap "${ERNIC_TAP_PREFIX}1" \
            --mac 02:a0:d1:00:00:01 \
            --verbose > /tmp/server1.log 2>&1 &
          echo "ERNIC_PID1=$!" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            timeout 1 bash -c "echo > /dev/tcp/localhost/${TCP_PORT}" 2>/dev/null && break
            sleep 1
          done
          timeout 1 bash -c "echo > /dev/tcp/localhost/${TCP_PORT}" 2>/dev/null || {
            echo "manager never listened on ${TCP_PORT}"; cat /tmp/server1.log; exit 1; }

          rocm-ernic \
            --socket /tmp/vfio-user-server2.sock \
            --backend "tcp:worker:localhost:${TCP_PORT}" \
            --tap "${ERNIC_TAP_PREFIX}2" \
            --mac 02:a0:d1:00:00:02 \
            --verbose > /tmp/server2.log 2>&1 &
          echo "ERNIC_PID2=$!" >> "$GITHUB_ENV"

          for n in 1 2; do
            for _ in $(seq 1 45); do
              [ -S "/tmp/vfio-user-server${n}.sock" ] && break
              sleep 1
            done
            [ -S "/tmp/vfio-user-server${n}.sock" ] || {
              echo "server${n} socket never appeared"; cat "/tmp/server${n}.log"; exit 1; }
            chmod 666 "/tmp/vfio-user-server${n}.sock"
          done

      - name: Verify the TCP mesh formed
        run: |
          for _ in $(seq 1 30); do
            grep -q "TCP: Registered with manager" /tmp/server2.log && \
            grep -q "TCP: Registered node" /tmp/server1.log && break
            sleep 2
          done
          grep -q "TCP: Registered with manager" /tmp/server2.log || {
            echo "worker never registered"
            tail -40 /tmp/server1.log; tail -40 /tmp/server2.log; exit 1; }
          grep -m1 "TCP: Registered node" /tmp/server1.log
          grep -m1 "TCP: Received mesh topology" /tmp/server2.log || true

      - name: Start the two QEMU VMs
        env:
          VM_DISK_1: ${{ steps.overlays.outputs.vm_disk_1 }}
          VM_DISK_2: ${{ steps.overlays.outputs.vm_disk_2 }}
        run: |
          start_vm() {
            n=$1; disk=$2; port=$3
            # Only VM 2 gets the GPU, passed as the function's positional
            # parameters so the JSON reaches QEMU as one argument. rombar=0
            # because rocjitsu serves no option ROM, and a guest that goes
            # looking for one oopses in the RAS VBIOS query.
            set --
            # if/fi, not `[ ] && x=y`: under `bash -e` the failing test would be
            # the whole command's status and kill the step for VM 1.
            if [ "$n" = 2 ]; then
              set -- -device '{"driver":"vfio-user-pci","rombar":0,"socket":{"type":"unix","path":"'"${GITHUB_WORKSPACE}"'/vfu/rocjitsu.sock"}}'
            fi
            "${QEMU_PATH:-}qemu-system-x86_64" \
              -machine "q35,accel=${QEMU_ACCEL},memory-backend=mem${n}" \
              -cpu "${QEMU_CPU}" -smp "${VM_VCPUS}" -m "${VM_MEM_MB}M" \
              -object "memory-backend-memfd,id=mem${n},share=on,size=${VM_MEM_MB}M" \
              -nographic \
              -drive file="$disk",format=qcow2,if=virtio \
              -netdev "user,id=net0,hostfwd=tcp::${port}-:22" \
              -device virtio-net-pci,netdev=net0 \
              -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server'"$n"'.sock"}}' \
              "$@" \
              -serial "file:/tmp/qemu-vm${n}-console.log" -monitor none \
              -qmp "unix:/tmp/qmp-vm${n}.sock,server=on,wait=off" > "/tmp/qemu-vm${n}.log" 2>&1 &
            echo "QEMU_PID${n}=$!" >> "$GITHUB_ENV"
          }
          start_vm 1 "${VM_DISK_1}" "$VM1_SSH_PORT"
          start_vm 2 "${VM_DISK_2}" "$VM2_SSH_PORT"
          sleep 5
          # The loop runs in a subshell: its exit fails the pipeline, and
          # with it the step.
          awk -F= '/^QEMU_PID/{print $2}' "$GITHUB_ENV" | while read -r pid; do
            kill -0 "$pid" 2>/dev/null || { cat /tmp/qemu-vm1.log /tmp/qemu-vm2.log; exit 1; }
          done

      - name: Wait for both VMs over SSH
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            for _ in $(seq 1 60); do
              ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=5 -p "$port" "${VM_USER}@localhost" true \
                2>/dev/null && break
              sleep 5
            done
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -p "$port" "${VM_USER}@localhost" echo "VM_READY on $port" || {
              cat "/tmp/qemu-vm1-console.log" "/tmp/qemu-vm2-console.log"; exit 1; }
          done

      - name: Disable the guest's amdgpu driver apt sources
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          # The guest image's build added repo.radeon.com/amdgpu/31.60 as an
          # apt source to install amdgpu-dkms, and that tree has since
          # disappeared from repo.radeon.com. Nothing here installs from it --
          # the driver is baked into the image -- but every apt-get update in
          # the guest, the ernic Ansible collection's included, fails on its
          # missing Release file. Mark the stanza "Enabled: no" rather than
          # deleting it, so the change is visible from inside the guest. On an
          # image without the source this does nothing; remove it once
          # GUEST_ARTIFACT_TAG names such an image.
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -p "$port" "${VM_USER}@localhost" bash -s << 'EOFVM'
          set -euo pipefail
          shopt -s nullglob
          for f in /etc/apt/sources.list.d/*.sources; do
            grep -q 'repo\.radeon\.com/amdgpu/' "$f" || continue
            tmp=$(mktemp)
            # deb822 field names are case-insensitive, and the stanza may
            # already carry an Enabled field (possibly "yes"): rewrite that
            # one to "no", and append the field only when there is none.
            awk 'BEGIN { RS = ""; ORS = "\n\n" }
                 /repo\.radeon\.com\/amdgpu\// {
                   n = split($0, line, "\n"); s = ""; found = 0
                   for (i = 1; i <= n; i++) {
                     if (line[i] ~ /^[Ee][Nn][Aa][Bb][Ll][Ee][Dd][ \t]*:/) {
                       line[i] = "Enabled: no"; found = 1
                     }
                     s = s (i > 1 ? "\n" : "") line[i]
                   }
                   $0 = found ? s : s "\nEnabled: no"
                 }
                 { print }' "$f" > "$tmp"
            sudo install -m 0644 "$tmp" "$f"
            rm -f "$tmp"
            echo "Disabled the amdgpu driver apt source in $f"
          done
          EOFVM
          done

      - name: Install kernel headers and build tools in both VMs
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -p "$port" "${VM_USER}@localhost" bash -s << 'EOFVM'
          set -e
          KVER=$(uname -r)
          # A guest on a mainline kernel already has its headers from the
          # .deb, and kernel.ubuntu.com has no Packages index behind it.
          HEADER_PKG=""
          [ -d "/lib/modules/${KVER}/build" ] || HEADER_PKG="linux-headers-${KVER}"
          APT_LOCK_WAIT="-o DPkg::Lock::Timeout=300"
          for i in 1 2 3; do sudo apt-get $APT_LOCK_WAIT update -qq && break || sleep 5; done
          for i in 1 2 3 4 5; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_LOCK_WAIT install -y -qq \
              ${HEADER_PKG} dkms git build-essential cmake ninja-build \
              pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
            [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
            sleep 10
          done
          echo "Kernel packages installed for ${KVER}"
          EOFVM
          done

      - name: Provision both VMs with the ernic Ansible collection
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          ERNIC_RUN_DIR=/tmp/ernic-ci
          mkdir -p "$ERNIC_RUN_DIR"
          cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
          {
            "instances": [
              { "id": 1, "vm": { "vm_name": "hipobj-2vmgpu-1",
                                 "ssh_port": ${VM1_SSH_PORT}, "ssh_user": "${VM_USER}" } },
              { "id": 2, "vm": { "vm_name": "hipobj-2vmgpu-2",
                                 "ssh_port": ${VM2_SSH_PORT}, "ssh_user": "${VM_USER}" } }
            ]
          }
          EOFJSON
          export ANSIBLE_HOST_KEY_CHECKING=false
          export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY"
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          ansible-playbook ci-site.yml --tags guest-setup \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_run_dir="$ERNIC_RUN_DIR" \
            -e ernic_instances=2 \
            -e ernic_vm_ssh_base_port="$VM1_SSH_PORT" \
            -e ernic_vm_ssh_user="$VM_USER" \
            -e ernic_gpu_passthrough=false \
            -e ernic_guest_agent=false \
            -e ernic_set_hostname=false

      - name: Verify the RDMA device in both VMs
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          vm_ssh() {
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no "$@"
          }
          for spec in "1:${VM1_SSH_PORT}" "2:${VM2_SSH_PORT}"; do
            n=${spec%%:*}; port=${spec##*:}
            # By PCI vendor ID, never by name: the kernel registers ionic_%d
            # and udev rewrites it twice.
            DEV=$(vm_ssh -p "$port" "${VM_USER}@localhost" 'sh -s' \
              < "${GITHUB_WORKSPACE}/rocm-ernic/scripts/find-rdma-device.sh" | tr -d '\r') || true
            [ -n "$DEV" ] || {
              echo "VM ${n}: no RDMA device"
              vm_ssh -p "$port" "${VM_USER}@localhost" \
                'ibv_devices; lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
              exit 1
            }
            vm_ssh -p "$port" "${VM_USER}@localhost" "ibv_devinfo -d $DEV" \
              | grep -q PORT_ACTIVE || { echo "VM ${n}: $DEV not PORT_ACTIVE"; exit 1; }
            echo "VM ${n}: $DEV is PORT_ACTIVE"
            echo "RDMA_DEVICE_${n}=$DEV" >> "$GITHUB_ENV"
          done

      - name: Verify VM 2 enumerated the GPU function
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          vm_ssh() {
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no "$@"
          }
          # Count by sysfs vendor/device, never by parsing lspci. lspci needs
          # /usr/share/misc/pci.ids, and a guest this early is still running
          # the boot's apt work -- one run caught pciutils mid-rewrite, and
          # lspci bailed with "Parse error at line 28286" after one device,
          # which reads exactly like a function that never attached.
          count() {
            vm_ssh -p "$2" "${VM_USER}@localhost" \
              "grep -lix '$1' /sys/bus/pci/devices/*/vendor 2>/dev/null | wc -l" | tr -d '\r'
          }
          # 0x1dd8 is Pensando (the emulated ionic NIC), 0x1002 is AMD (rocjitsu).
          [ "$(count 0x1dd8 "$VM2_SSH_PORT")" -ge 1 ] || {
            echo "VM 2: emulated ionic NIC not enumerated"; exit 1; }
          [ "$(count 0x1002 "$VM2_SSH_PORT")" -ge 1 ] || {
            echo "VM 2: emulated rocjitsu GPU not enumerated"; exit 1; }
          # VM 1 must NOT have one -- the asymmetry is the point of the lane.
          if [ "$(count 0x1002 "$VM1_SSH_PORT")" -ne 0 ]; then
            echo "VM 1 has a GPU; this lane is supposed to be asymmetric"; exit 1
          fi
          echo "VM 2 has both functions, VM 1 has only the NIC"
          vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" 'lspci -nn' || true

      - name: Stage ip_discovery.bin into VM 2
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -P "$VM2_SSH_PORT" "${GITHUB_WORKSPACE}/rj-fw/ip_discovery.bin" \
            "${VM_USER}@localhost:/tmp/"
          # updates/ takes precedence over the packaged firmware, and is where
          # the guest's baked gap stubs already live.
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            'sudo install -D -m 0644 /tmp/ip_discovery.bin \
               /lib/firmware/updates/amdgpu/ip_discovery.bin && \
             ls -l /lib/firmware/updates/amdgpu/'

      - name: Load amdgpu in VM 2 via amdgpu-probe
        timeout-minutes: 8
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          # Bounded at three layers -- guest-side timeout, ssh keepalive, step
          # timeout -- so the hang qemu-minimal parks its lane on reports
          # instead of eating the job budget.
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
              "sudo timeout 300 /usr/local/bin/amdgpu-probe"
          echo "amdgpu-probe completed"

      - name: Verify amdgpu bound a GPU in VM 2
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          vm_ssh() {
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no "$@"
          }
          vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            'lsmod | grep -q amdgpu' || { echo "amdgpu module not loaded"; exit 1; }
          # /dev/kfd is not a valid assertion: kfd_chardev_init() creates it
          # before amdgpu_init() registers the PCI driver, so it exists even
          # when every probe failed. Node 0 is the CPU and has an empty name;
          # a bound GPU adds a named node.
          gpus=$(vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            'cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c .')
          [ "$gpus" -ge 1 ] || {
            echo "amdgpu loaded but never bound the device"
            vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
              'sudo dmesg | grep -i amdgpu | tail -40' || true
            exit 1
          }
          echo "GPU KFD node present in VM 2 ($gpus)"

      - name: Copy hipObject binaries into both VMs
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          BUILD="${GITHUB_WORKSPACE}/ernic-build"
          vm_scp() {
            scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no "$@"
          }
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -p "$port" \
              "${VM_USER}@localhost" \
              'mkdir -p /tmp/hipobject-build/test/integration/rdma-test-server /tmp/hipobject-build/integrations/minio-cpp'
            vm_scp -P "$port" -r "${BUILD}/rocm-libs" "${VM_USER}@localhost:/tmp/hipobject-build/rocm-libs"
            vm_scp -P "$port" "${BUILD}/test/integration/rdma-test-server/hipobj-rdma-test-server" \
                              "${VM_USER}@localhost:/tmp/hipobject-build/test/integration/rdma-test-server/"
            vm_scp -P "$port" "${BUILD}/integrations/minio-cpp/minio-getput-rdma" \
                              "${VM_USER}@localhost:/tmp/hipobject-build/integrations/minio-cpp/"
            vm_scp -P "$port" ci/ernic/server-entrypoint.sh ci/ernic/client-entrypoint.sh \
                              ci/ernic/assert-transfer.sh \
                              "${VM_USER}@localhost:/tmp/hipobject-build/"
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -p "$port" \
              "${VM_USER}@localhost" 'chmod +x /tmp/hipobject-build/*.sh \
                 /tmp/hipobject-build/integrations/minio-cpp/* \
                 /tmp/hipobject-build/test/integration/rdma-test-server/*'
          done

      - name: Start hipobj-rdma-test-server in VM 1
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          vm_ssh() {
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no "$@"
          }
          # systemd-run, not `nohup ... &` over ssh: a backgrounded remote
          # command leaves nothing to ask about afterwards. If it dies at
          # startup the only evidence is an empty log file, which is exactly
          # how the first run of this lane failed.
          vm_ssh -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
            "sudo systemd-run --unit=hipobj-server \
               --setenv=HIPOBJ_NIC_HINT='${RDMA_DEVICE_1}' \
               --setenv=SERVER_PORT='${SERVER_PORT}' \
               /tmp/hipobject-build/server-entrypoint.sh"

          dump_server() {
            echo "=== VM 1: systemctl status hipobj-server ==="
            vm_ssh -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
              'systemctl status hipobj-server --no-pager -l || true
               sudo journalctl -u hipobj-server --no-pager | tail -60
               ss -ltnp 2>/dev/null | head -20
               ip -4 -br addr show' || true
          }

          # From VM 2, not from VM 1: the point of the probe is that the
          # listener is reachable across the emulated wire.
          for _ in $(seq 1 45); do
            vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
              "timeout 2 bash -c 'echo > /dev/tcp/${VM1_ADDR}/${SERVER_PORT}'" \
              2>/dev/null && { echo "server reachable at ${VM1_ADDR}:${SERVER_PORT}"; break; }
            # No point waiting out the loop once the unit has given up.
            vm_ssh -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
              'systemctl is-active --quiet hipobj-server' || {
              echo "hipobj-server is no longer running"; dump_server; exit 1; }
            sleep 2
          done
          vm_ssh -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            "timeout 2 bash -c 'echo > /dev/tcp/${VM1_ADDR}/${SERVER_PORT}'" || {
            echo "VM 2 cannot reach the test server"
            dump_server
            exit 1
          }

      - name: Run the ${{ matrix.buffer_label }} v1 client in VM 2
        id: client
        timeout-minutes: 10
        # TEMPORARY. This lane has never passed: the remote read of the
        # client's dmabuf address fails with IBV_WC_REM_ACCESS_ERR, root cause
        # open (see the step below). Non-fatal so the rest of the PR is not
        # held behind it -- everything up to this point is still fatal, so a
        # regression in the build, the guests, the NIC or the GPU enumeration
        # still fails the job. Remove this the moment the transfer works.
        continue-on-error: ${{ matrix.allow_failure }}
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          GPU_MODE="${{ matrix.gpu_mode }}"
          # Bounded at three layers, as amdgpu-probe above: guest-side timeout,
          # ssh keepalive, step timeout. Unbounded, this step wedged for the
          # full 120-minute job budget at 60dc91f -- the client never returned
          # and nothing was watching. The peers finish in 8 to 11 minutes.
          # sudo: /dev/kfd and /dev/dri/render* are root:render 0660 and the
          # guest's login user is in neither group, so the HIP runtime
          # enumerates no agent and hipMalloc returns hipErrorNoDevice.
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            "cmd=\"sudo timeout 420 env HIPOBJ_NIC_HINT='${RDMA_DEVICE_2}' \
               BUILD_DIR=/tmp/hipobject-build \
               SERVER_ENDPOINT='http://${VM1_ADDR}:${SERVER_PORT}' \
               TEST_SIZE='${TEST_SIZE}' \
               GPU_MODE='${GPU_MODE}'\"; \
             if [ \"${GPU_MODE}\" = gpu ]; then cmd=\"\$cmd HIPOBJ_REQUIRE_GPU_DIRECT=1\"; fi; \
             eval \"\$cmd /tmp/hipobject-build/client-entrypoint.sh\""

      - name: Report the known AIS failure
        if: steps.client.outcome == 'failure' && matrix.gpu_mode == 'gpu'
        run: |
          echo "::warning title=Known failure::Two-VM AIS GPU-buffer transfer failed. \
          The job is green only because the client step is continue-on-error."
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ### Two-VM AIS GPU Buffer: KNOWN FAILING

          The GPU-buffer transfer failed and the step is `continue-on-error`,
          so this job reports success. **It did not pass.**

          The remote read of the client's dmabuf address fails immediately with
          `IBV_WC_REM_ACCESS_ERR` (`status=10 vendor_err=0x9`) at 1 MiB, well
          under the 16 MiB `IONIC_MESH_MAX_MSG` cap.

          Ruled out by measurement on a two-guest lab that passes 8/8 with the
          same binaries: rocjitsu build, QEMU build, guest memory, vCPU count,
          accelerator, `ip_discovery.bin`, the message-size cap and BAR
          placement. The one component not yet swapped is `rocm-ernic` itself.
          EOF
      - name: Collect logs
        if: always()
        env:
          SSH_KEY: ${{ steps.vm_info.outputs.ssh_key }}
          VM_USER: ${{ steps.vm_info.outputs.vm_user }}
        run: |
          for n in 1 2; do
            echo "=== server${n}.log ===";         tail -100 "/tmp/server${n}.log"        || true
            echo "=== qemu-vm${n}.log ===";        cat "/tmp/qemu-vm${n}.log"             || true
            echo "=== qemu-vm${n}-console ===";  tail -200 "/tmp/qemu-vm${n}-console.log" || true
          done
          echo "=== rocjitsu ==="; docker logs rocjitsu-2vm 2>&1 || true
          echo "=== VM 2 amdgpu dmesg ==="
          timeout 60 ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            'sudo dmesg | grep -i "amdgpu\|kfd" | tail -60' || true
          echo "=== VM 1 hipobj-server journal ==="
          timeout 60 ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
            'sudo journalctl -u hipobj-server --no-pager | tail -100' || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f rocjitsu-2vm 2>/dev/null || true
          kill "${QEMU_PID1:-}" "${QEMU_PID2:-}"   2>/dev/null || true
          kill "${ERNIC_PID1:-}" "${ERNIC_PID2:-}" 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build" 2>/dev/null || true
