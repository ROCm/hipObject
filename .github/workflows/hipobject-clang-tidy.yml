name: hipObject - clang-tidy

# Builds with HIPOBJ_USE_CLANG_TIDY, which runs clang-tidy on each C++
# file as it's compiled, with the checks in .clang-tidy. Every finding is
# an error, so the job fails if clang-tidy reports anything. It also
# builds with HIPOBJ_WERROR, so a compiler warning fails it too.
#
# This uses upstream clang-tidy rather than ROCm's, which is built
# without the clang-analyzer-* checks, as hipFile's clang-tidy workflow
# does. The compiler is still ROCm's amdclang++. Keep LLVM_VERSION at
# the LLVM major version of the job's ROCm where apt.llvm.org has a
# release of it, so clang-tidy understands the compiler's flags. ROCm
# 10.1 is LLVM 24, which only has snapshot builds, so this uses LLVM 23,
# the newest release. That works while the build uses no warning flag
# newer than Clang 23 (see HIPOBJClangCompilerOptions.cmake).

on:
  # The same triggers and paths as the Build workflow, since anything that
  # it compiles can have findings, plus this workflow's own file and the
  # action that installs ROCm. The
  # .clang-tidy files are matched by '**'. The paths are a list with
  # negations and not paths-ignore, so the last entry can add a path back
  # (see hipobject-build.yml).
  pull_request:
    branches: [develop]
    paths: &paths
      - '**'
      - '!**/*.md'
      - '!**/*.rst'
      - '!ansible/**'
      - '!ci/**'
      - '!cmake/HIPOBJDocumentation.cmake'
      - '!docs/**'
      - '!requirements.txt'
      - '!.github/**'
      - '.github/workflows/hipobject-clang-tidy.yml'
      - '.github/actions/install-rocm/**'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    # A plain Ubuntu image, with only the ROCm that hipObject needs
    # installed (see Install ROCm below)
    container:
      image: ubuntu:26.04
      options: --user root
    env:
      # Packages such as tzdata ask questions when they're installed into a
      # plain image; this takes their defaults instead.
      DEBIAN_FRONTEND: noninteractive
      LLVM_VERSION: 23
      # The Ubuntu release of the image, for apt.llvm.org
      UBUNTU_CODENAME: resolute
      # The fingerprint of apt.llvm.org's signing key, which is public
      LLVM_SIGNER_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-essential is GCC, whose libstdc++ amdclang uses. Ninja keeps
      # each command's output together, so clang-tidy's output for one
      # file isn't interleaved with another's in the build log. The MinIO
      # bridge needs nlohmann-json3-dev, libpugixml-dev, and zlib1g-dev,
      # and libcurlpp-dev saves downloading and building curlpp.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            gnupg \
            libcurl4-openssl-dev \
            libcurlpp-dev \
            libibverbs-dev \
            libpugixml-dev \
            libssl-dev \
            ninja-build \
            nlohmann-json3-dev \
            zlib1g-dev

      # After the compilers, so the libstdc++ that ROCm's compiler
      # packages need is the one already installed
      - name: Install ROCm
        uses: ./.github/actions/install-rocm
        with:
          version: '10.1'

      # apt only trusts the key with the known fingerprint, and only for
      # this repository. Exporting the key by its fingerprint from a
      # scratch keyring leaves out any other key in the download, and
      # exports nothing if the key isn't there.
      - name: Install clang-tidy
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            -o /tmp/llvm.asc
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import /tmp/llvm.asc
          install -d -m 0755 /etc/apt/keyrings
          gpg --batch --export "${LLVM_SIGNER_FINGERPRINT}" \
            > /etc/apt/keyrings/llvm.gpg
          if [[ ! -s /etc/apt/keyrings/llvm.gpg ]]; then
            echo "::error::apt.llvm.org's key isn't ${LLVM_SIGNER_FINGERPRINT}"
            exit 1
          fi
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg]" \
            "https://apt.llvm.org/${UBUNTU_CODENAME}/" \
            "llvm-toolchain-${UBUNTU_CODENAME}-${LLVM_VERSION} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            "clang-tidy-${LLVM_VERSION}"
          "clang-tidy-${LLVM_VERSION}" --version

      # Setting HIPOBJ_CLANG_TIDY_EXE makes the build use the clang-tidy
      # installed above, rather than whatever HIPOBJClangTidy.cmake's
      # search finds first.
      #
      # HIPOBJ_WERROR is on, so a compiler warning fails this job too, as
      # it does the Build workflow's jobs.
      #
      # CMake picks the compilers up from CC and CXX.
      - name: Configure
        run: |
          export CC="${ROCM_PATH}/llvm/bin/amdclang"
          export CXX="${ROCM_PATH}/llvm/bin/amdclang++"
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_WERROR=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON \
            -DHIPOBJ_MINIO_CLIENT=ON \
            -DHIPOBJ_USE_CLANG_TIDY=ON \
            -DHIPOBJ_CLANG_TIDY_EXE="/usr/bin/clang-tidy-${LLVM_VERSION}"

      # -k 0 keeps building after a file fails, so one run reports every
      # finding, not just those in the first files to fail. pipefail
      # keeps tee from hiding the build's exit status.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 0 2>&1 \
            | tee build/clang-tidy.log

      # A header's findings are reported once for each file that includes
      # it, so the lines are deduplicated before they're counted. There's
      # no log if an earlier step failed.
      - name: Summarize findings
        if: failure()
        run: |
          if [[ ! -f build/clang-tidy.log ]]; then
            exit 0
          fi
          {
            echo '# clang-tidy findings'
            echo
            echo 'Findings by check or compiler warning:'
            echo '```'
            grep -E ': (warning|error): .*\[[^][]+\]$' \
              build/clang-tidy.log \
              | sort -u \
              | sed -E 's/.*\[([^][]+)\]$/\1/; s/,-warnings-as-errors$//; s/^-Werror,//' \
              | sort | uniq -c | sort -rn
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
