name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: rocm/dev-ubuntu-24.04:7.2
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            git \
            libibverbs-dev \
            libnuma-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build && ctest --output-on-failure
