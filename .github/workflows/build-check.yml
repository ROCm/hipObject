name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rocm-version: ['6.3']
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4

      - name: Install ROCm
        run: |
          wget https://repo.radeon.com/amdgpu-install/latest/ubuntu/jammy/amdgpu-install_6.3.60300-1_all.deb
          sudo apt-get install -y ./amdgpu-install_6.3.60300-1_all.deb
          sudo amdgpu-install -y --usecase=rocm --no-dkms
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libibverbs-dev \
            libnuma-dev \
            libhsa-runtime-dev || true

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/bin/hipcc \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build && ctest --output-on-failure
