name: hipObject - pylint

on:
  pull_request:
    branches: [develop]
    paths: &paths
      - '**.py'
      - '.github/workflows/hipobject-pylint.yml'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  pylint:
    name: Lint Python files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.10, the oldest version hipObject supports, runs the thread-safety
      # checker below. The last version listed is the default, python.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.12

      # Pinned because black changes its style every year, and a new
      # release would otherwise fail PRs that don't touch the code.
      - name: Install black and pylint
        run: python -m pip install black==26.10.0 pylint==4.1.2

      # Both target Python 3.10, the oldest version hipObject supports.
      - name: Lint Python files
        run: |
          mapfile -t files < <(git ls-files -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Python files found!"
            exit 1
          fi
          echo "Linting the following files:"
          printf '%s\n' "${files[@]}"
          black --check --diff --target-version py310 "${files[@]}"
          pylint --py-version=3.10 "${files[@]}"

      # The Build workflow runs these through ctest, but skips changes that
      # touch only the checker's Python files, so they run here. -B keeps
      # Python from writing __pycache__ into the checkout.
      - name: Test the thread-safety checker
        run: |
          python3.10 -B test/thread-safety/test_check_thread_safety_tags.py
          python3.10 -B test/thread-safety/check_thread_safety_tags.py \
            include/hipobj.h src/hipobj.cpp
