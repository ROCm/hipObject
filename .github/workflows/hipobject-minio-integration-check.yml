name: hipObject - MinIO Integration Check

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # dl.min.io returns HTTP 410 for all binaries and the minio/minio and
  # minio/mc images were withdrawn from Docker Hub, so both binaries now come
  # from the GitHub release assets. MinIO stopped attaching assets to releases
  # after the tags below, so these are the last downloadable builds -- pinned
  # with digests rather than tracking a moving "latest".
  MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
  MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
  MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
  MC_SHA256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MINIO_ENDPOINT: http://127.0.0.1:9000
  TEST_BUCKET: hipobj-ci
  TEST_OBJECT: test-object
  TEST_SIZE: "1048576"

jobs:
  minio-integration:
    name: MinIO Integration Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rocm/dev-ubuntu-24.04:10.0.0-full
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
      # The full ROCm image ships libamdhip64 in /opt/rocm/lib but leaves it out
      # of the loader cache, so ctest binaries fail to start without this.
      LD_LIBRARY_PATH: /opt/rocm/lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            curl \
            git \
            libcurl4-openssl-dev \
            libssl-dev \
            libibverbs-dev \
            libnuma-dev

      - name: Install mc (MinIO client)
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/minio/mc/releases/download/${MC_RELEASE}/mc.linux-amd64.${MC_RELEASE}" \
            -o /usr/local/bin/mc
          echo "${MC_SHA256}  /usr/local/bin/mc" | sha256sum -c -
          chmod +x /usr/local/bin/mc
          mc --version

      - name: Install MinIO server
        shell: bash
        run: |
          # Community MinIO: it has no RDMA data plane, which is what the
          # control-plane fallback assertions below expect.
          curl -fsSL \
            "https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/minio.linux-amd64.${MINIO_RELEASE}" \
            -o /usr/local/bin/minio
          echo "${MINIO_SHA256}  /usr/local/bin/minio" | sha256sum -c -
          chmod +x /usr/local/bin/minio
          minio --version

      - name: Start MinIO
        shell: bash
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=$MINIO_ROOT_USER \
          MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD \
            /usr/local/bin/minio server /tmp/minio-data \
              --address 127.0.0.1:9000 \
              --console-address 127.0.0.1:9001 \
              &>/tmp/minio.log &
          echo $! > /tmp/minio.pid

          for i in $(seq 1 30); do
            curl -sf "$MINIO_ENDPOINT/minio/health/live" && break
            sleep 1
          done
          curl -sf "$MINIO_ENDPOINT/minio/health/live" || \
            { cat /tmp/minio.log; exit 1; }

      - name: Create test bucket
        run: |
          mc alias set ci "$MINIO_ENDPOINT" \
            "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" --insecure
          mc mb ci/$TEST_BUCKET

      - name: Build hipObject with curl support
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: cd build && ctest --output-on-failure

      - name: S3 control-plane PUT (no RDMA hardware — expect 501 fallback)
        run: |
          # No RDMA NIC is present in the CI runner; MinIO should respond
          # with x-amz-rdma-reply: 501, and the example exits 1 as expected.
          put_output=$(./build/examples/put-object \
            "$TEST_SIZE" \
            --live "$MINIO_ENDPOINT" "$TEST_BUCKET" "$TEST_OBJECT" 2>&1 || true)
          echo "$put_output"
          echo "$put_output" | grep -qE "would send RDMA token|NIC not found|S3 error|501" || \
            { echo "ERROR: unexpected output from put-object"; exit 1; }

      - name: Seed object via mc for GET test
        run: |
          dd if=/dev/urandom bs="$TEST_SIZE" count=1 2>/dev/null \
            | mc pipe ci/$TEST_BUCKET/$TEST_OBJECT

      - name: S3 control-plane GET (no RDMA hardware — expect 501 fallback)
        run: |
          get_output=$(./build/examples/get-object \
            "$TEST_SIZE" \
            --live "$MINIO_ENDPOINT" "$TEST_BUCKET" "$TEST_OBJECT" 2>&1 || true)
          echo "$get_output"
          echo "$get_output" | grep -qE "would send RDMA token|NIC not found|S3 error|501" || \
            { echo "ERROR: unexpected output from get-object"; exit 1; }

      - name: Verify MinIO served requests (sanity check server logs)
        run: |
          grep -q "200\|PUT\|GET" /tmp/minio.log || \
            { echo "WARNING: no successful S3 requests found in MinIO log"; }
          cat /tmp/minio.log

      - name: Stop MinIO
        if: always()
        run: |
          if [ -f /tmp/minio.pid ]; then
            kill "$(cat /tmp/minio.pid)" 2>/dev/null || true
          fi
