name: hipObject - cmakelint

on:
  pull_request:
    branches: [develop]
    paths: &paths
      - '**.cmake'
      - '**/CMakeLists.txt'
      - '.cmakelintrc'
      - '.github/workflows/hipobject-cmakelint.yml'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  cmakelint:
    name: Lint CMake files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cmakelint
        run: python -m pip install cmakelint==1.4.3

      # Run from the top of the tree: cmakelint reads .cmakelintrc from
      # the current directory.
      - name: Lint CMake files
        run: |
          mapfile -t files < <(git ls-files -- \
            'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No CMake files found!"
            exit 1
          fi
          echo "Linting the following files:"
          printf '%s\n' "${files[@]}"
          cmakelint "${files[@]}"
