#
# Two-container ernic integration tests.  rocm-ernic provides a
# software-emulated Pensando/ionic NIC; transfers are functionally
# equivalent to real RDMA hardware.
#
# Job 1 - ernic-integration (v2 protocol), two guest VMs:
#   Two rocm-ernic instances on the runner, joined by a tcp:manager /
#   tcp:worker mesh and each bridged onto ernicbr0 through its own tap, serve
#   one emulated ionic function apiece. VM 1 (192.168.200.10) runs
#   hipobj-rdma-test-server --v2 on port 9000; VM 2 (192.168.200.20) runs
#   put-object / get-object / v2-data-client against it. Containers cannot
#   host this: rocm-ernic offers a vfio-user PCI function, and it takes a
#   guest's ionic/ionic_rdma drivers to turn that into a verbs device.
#   Modelled on rocm-ernic's own system-test-two-vms lane.
#
# Job 2 - ernic-minio-v1 (v1 protocol, minio-cpp bridge, hipobj-rdma-test-server):
#   ernic-server-v1: hipobj-rdma-test-server (v1 mode) on port 9000.
#   rocjitsu:        rocjitsu GPU emulator serving a vfio-user socket via a
#                    shared tmpfs volume (wired for future GPU path; client
#                    currently runs in nogpu mode — /dev/kfd + /dev/dri not
#                    present in Docker without vfio-pci passthrough).
#   ernic-minio-client: minio-getput-rdma in nogpu+HTTP-only mode;
#                    payload integrity verified end-to-end.
#
# Job 3 - ernic-s3-backend (rocm-ernic --backend s3):
#   rocm-ernic runs on the runner with an in-process S3 object store whose
#   HTTP endpoint is terminated in-band on the emulated wire, so one guest
#   VM and one server are a complete object fabric -- no tap, no second VM.
#   The VM attaches the vfio-user function, is provisioned with the ionic
#   DKMS driver by rocm-ernic's own Ansible collection, and then runs
#   minio-getput-rdma against the store with HIPOBJ_NIC_HINT set to the
#   discovered device. This is the job that exercises the RDMA data path:
#   a passing run carries x-amz-rdma-token / x-amz-rdma-reply on the wire.
#
# Job 4 - ernic-rocjitsu-gpu (GPU-direct S3 over RDMA):
#   As job 3, plus rocjitsu's emulated gfx1250 as a second vfio-user
#   function in the same guest, so minio-getput-rdma runs against a real
#   hipMalloc'd device buffer. See the comment above the job for the
#   requirements this topology has; they are not obvious.

name: hipObject - Emulated Hardware Check

on:
  # PR-gated and manual only. These four jobs boot VMs and take tens of
  # minutes; nothing reaches develop without passing them on the PR, so a
  # second post-merge run would buy nothing but queue time.
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "examples/**"
      - "integrations/**"
      - "ci/ernic/**"
      - ".github/workflows/hipobject-emulated-hardware-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump these intentionally when the ernic or rocjitsu images are updated.
  # Every tag here is the date-prefixed, content-versioned one
  # (<date>.<repo-sha>-<component>.<sha>-vfu.<sha>): immutable, so a rebuild
  # cannot change what a lane tests underneath it, and legible about which
  # rocm-ernic / rocjitsu / libvfio-user sources went into it. The older
  # `september-17-2026-ionic` and `august-28-2026` date-word tags had no
  # equivalent in that scheme and are gone.
  # ERNIC_IMAGE: ernic.0b48aa1, the build whose rocm-ernic carries the s3
  #   backend. One variable for every lane: the old ERNIC_IMAGE_LATEST split
  #   existed only because ERNIC_IMAGE was held back on a date-word tag.
  ERNIC_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244
  ROCJITSU_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260924.gad7a357-rocjitsu.c85bb75
  # ROCJITSU_IMAGE_GPU: the tag qemu-minimal's ernic-rocjitsu lane runs, for
  #   the VM-based emulated-GPU lane below. ip_discovery.bin must come from
  #   whichever rocjitsu build serves the socket, and the lane generates it
  #   from this image, so the two cannot drift apart.
  ROCJITSU_IMAGE_GPU: sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260924.gad7a357-rocjitsu.c85bb75
  ROCM_IMAGE: rocm/dev-ubuntu-24.04:10.0.0-full

jobs:
  ernic-integration:
    name: Two-VM v2 Protocol Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The previous container topology could not work and was gated off: with
    # no VM in the picture the container's /sys/class/infiniband stays empty,
    # so HIPOBJ_NIC_HINT=ernic0 never resolved. The missing piece was the
    # guest, not the image tag. This is that topology, taken from rocm-ernic's
    # own system-test-two-vms lane: two emulated NICs on one bridge, one
    # guest per NIC, hipObject's v2 server in the first and its clients in
    # the second.
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      # /dev/net/tun and NET_ADMIN are as load-bearing as /dev/kvm: without
      # them ionic_eth_net_send() has no fd and every guest frame is dropped,
      # which looks exactly like a healthy-but-silent link.
      options: --device /dev/kvm --device /dev/net/tun --cap-add=NET_ADMIN
    env:
      GUEST_ARTIFACT_REPO: docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ernic-rocjitsu
      GUEST_ARTIFACT_TAG: 20260925.g4868a2e-vm.resolute-ernic-rocjitsu-qm.e73a1e6-qcow2
      ERNIC_TAP_PREFIX: ernic-tap
      ERNIC_TAP_BRIDGE: ernicbr0
      TCP_PORT: 18515
      VM1_SSH_PORT: 2222
      VM2_SSH_PORT: 2223
      # ernic_guest_setup derives guest addresses as <subnet>.<10 * index>.
      VM1_ADDR: 192.168.200.10
      SERVER_PORT: 9000
      TEST_SIZE: 1048576

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Checkout rocm-ernic (Ansible collection + guest driver sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ROCm/rocm-ernic
          ref: develop
          path: rocm-ernic

      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq iproute2 sudo libibverbs1 libnl-3-200 \
            libnl-route-3-200 ansible python3-jmespath
          for attempt in 1 2 3; do
            ansible-galaxy collection install community.general && break
            echo "::warning::galaxy install failed (attempt ${attempt}/3)"
            sleep $((attempt * 20))
          done

      - name: Build hipObject binaries (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev libcurl4-openssl-dev libssl-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=OFF \
                -DHIPOBJ_BUILD_DOCS=OFF && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target hipobj-rdma-test-server put-object get-object \
                        v2-data-client && \
              mkdir -p /hipobject-build/rocm-libs && \
              export LD_LIBRARY_PATH=/opt/rocm/lib && \
              ldd /hipobject-build/test/integration/rdma-test-server/hipobj-rdma-test-server \
                | awk '/=> \//{print \$3}' \
                | grep -E '^/opt/(rocm|amdgpu)|/libpugixml\.so' \
                | xargs -r -I{} cp -L {} /hipobject-build/rocm-libs/ && \
              LD_LIBRARY_PATH=/hipobject-build/rocm-libs \
                ldd /hipobject-build/test/integration/rdma-test-server/hipobj-rdma-test-server \
                | grep 'not found' && { echo 'staged closure incomplete'; exit 1; } || \
                echo 'staged closure complete'
            "

      - name: Extract rocm-ernic binary from ernic image
        run: |
          docker create --name ernic-tmp-2vm "$ERNIC_IMAGE"
          # Not the workspace: it is mounted noexec in the job container.
          docker cp ernic-tmp-2vm:/usr/local/bin/rocm-ernic /usr/local/bin/rocm-ernic
          docker rm ernic-tmp-2vm
          chmod +x /usr/local/bin/rocm-ernic
          rocm-ernic --help > /tmp/ernic-help.txt
          head -3 /tmp/ernic-help.txt

      - name: Select QEMU accelerator and guest size
        run: |
          if [ -c /dev/kvm ] && ${QEMU_PATH:-}qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
            echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
            echo "QEMU_CPU=host"  >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg"  >> "$GITHUB_ENV"
            echo "QEMU_CPU=qemu64" >> "$GITHUB_ENV"
          fi
          HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          # IONIC_EQ_COUNT_MIN is 4: a guest with fewer online CPUs can never
          # register the ibdev, so 4 is a floor and not a preference, even
          # when that means oversubscribing the runner.
          VM_VCPUS=$(( ($(nproc) - 1) / 2 )); [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
          VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 / 2 ))
          [ "$VM_MEM_MB" -lt 1024 ] && VM_MEM_MB=1024
          [ "$VM_MEM_MB" -gt 4096 ] && VM_MEM_MB=4096
          echo "VM_VCPUS=$VM_VCPUS"   >> "$GITHUB_ENV"
          echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"

      - name: Fetch guest VM image
        id: guest_image
        uses: ./.github/actions/fetch-guest-vm
        with:
          repo: ${{ env.GUEST_ARTIFACT_REPO }}
          tag: ${{ env.GUEST_ARTIFACT_TAG }}

      - name: Read VM info
        id: vm_info
        run: |
          OUT="${{ steps.guest_image.outputs.output_dir }}"
          eval "$(python3 - "$OUT" <<'PYEOF'
          import json, os, shlex, sys
          out = sys.argv[1]
          d = json.load(open(os.path.join(out, "vm-info.json")))
          here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
          keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
          }
          for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
          PYEOF
          )"
          chmod 600 "$SSH_KEY_PRIVATE"
          echo "vm_user=$VM_USER"         >> "$GITHUB_OUTPUT"
          echo "vm_disk=$VM_DISK"         >> "$GITHUB_OUTPUT"
          echo "ssh_key=$SSH_KEY_PRIVATE" >> "$GITHUB_OUTPUT"

      - name: Create the per-VM disk overlays
        id: overlays
        run: |
          # Overlays, not copies. Both VMs get one including the first: with
          # VM 1 writing to the base directly, VM 2's backing file would
          # mutate underneath it.
          BASE="${{ steps.vm_info.outputs.vm_disk }}"
          STEM="$(dirname "$BASE")/$(basename "$BASE" .qcow2)"
          for n in 1 2; do
            DISK="${STEM}.${n}.qcow2"
            rm -f "$DISK"
            qemu-img create -f qcow2 -F qcow2 -b "$BASE" "$DISK" > /dev/null
            echo "vm_disk_${n}=$DISK" >> "$GITHUB_OUTPUT"
            qemu-img info "$DISK" | head -4
          done

      - name: Create the host bridge and per-instance TAPs
        run: |
          # ernic_host_setup owns this; run the role rather than open-coding
          # `ip tuntap`. Order matters -- rocm-ernic treats a missing --tap
          # as a startup failure, so the interfaces have to exist first.
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          ansible-playbook playbooks/host-setup.yml \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_build=false \
            -e ernic_install_service=false \
            -e ernic_gpu_passthrough=false \
            -e ernic_instances=2 \
            -e ernic_tap_owner=root \
            -e ernic_tap_bridge="${ERNIC_TAP_BRIDGE}" \
            -e ernic_tap_prefix="${ERNIC_TAP_PREFIX}"
          ip -o link show "${ERNIC_TAP_BRIDGE}"
          for n in 1 2; do ip -o link show "${ERNIC_TAP_PREFIX}${n}"; done

      - name: Start the two rocm-ernic instances
        run: |
          # --backend is the RDMA data path, --tap the Ethernet one; both are
          # needed. --mac is not optional once two instances share a bridge:
          # the emulator's built-in address is a constant, so without it both
          # guests come up on the same MAC and ARP can never resolve.
          for n in 1 2; do rm -f "/tmp/vfio-user-server${n}.sock"; done

          rocm-ernic \
            --socket /tmp/vfio-user-server1.sock \
            --backend "tcp:manager:listen:${TCP_PORT}" \
            --tap "${ERNIC_TAP_PREFIX}1" \
            --mac 02:a0:d1:00:00:01 \
            --verbose > /tmp/server1.log 2>&1 &
          echo "ERNIC_PID1=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            timeout 1 bash -c "echo > /dev/tcp/localhost/${TCP_PORT}" 2>/dev/null && break
            sleep 1
          done
          timeout 1 bash -c "echo > /dev/tcp/localhost/${TCP_PORT}" 2>/dev/null || {
            echo "manager never listened on ${TCP_PORT}"; cat /tmp/server1.log; exit 1; }

          rocm-ernic \
            --socket /tmp/vfio-user-server2.sock \
            --backend "tcp:worker:localhost:${TCP_PORT}" \
            --tap "${ERNIC_TAP_PREFIX}2" \
            --mac 02:a0:d1:00:00:02 \
            --verbose > /tmp/server2.log 2>&1 &
          echo "ERNIC_PID2=$!" >> "$GITHUB_ENV"

          for n in 1 2; do
            for i in $(seq 1 45); do
              [ -S "/tmp/vfio-user-server${n}.sock" ] && break
              sleep 1
            done
            [ -S "/tmp/vfio-user-server${n}.sock" ] || {
              echo "server${n} socket never appeared"; cat "/tmp/server${n}.log"; exit 1; }
            chmod 666 "/tmp/vfio-user-server${n}.sock"
          done

      - name: Verify the TCP mesh formed
        run: |
          for i in $(seq 1 30); do
            grep -q "TCP: Registered with manager" /tmp/server2.log && \
            grep -q "TCP: Registered node" /tmp/server1.log && break
            sleep 2
          done
          grep -q "TCP: Registered with manager" /tmp/server2.log || {
            echo "worker never registered"
            tail -40 /tmp/server1.log; tail -40 /tmp/server2.log; exit 1; }
          grep -m1 "TCP: Registered node" /tmp/server1.log
          grep -m1 "TCP: Received mesh topology" /tmp/server2.log || true

      - name: Start the two QEMU VMs
        run: |
          start_vm() {
            n=$1; disk=$2; port=$3
            ${QEMU_PATH:-}qemu-system-x86_64 \
              -machine q35,accel=${QEMU_ACCEL},memory-backend=mem${n} \
              -cpu ${QEMU_CPU} -smp ${VM_VCPUS} -m ${VM_MEM_MB}M \
              -object memory-backend-memfd,id=mem${n},share=on,size=${VM_MEM_MB}M \
              -nographic \
              -drive file="$disk",format=qcow2,if=virtio \
              -netdev user,id=net0,hostfwd=tcp::${port}-:22 \
              -device virtio-net-pci,netdev=net0 \
              -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-server'"$n"'.sock"}}' \
              -serial file:/tmp/qemu-vm${n}-console.log -monitor none \
              -qmp unix:/tmp/qmp-vm${n}.sock,server=on,wait=off > /tmp/qemu-vm${n}.log 2>&1 &
            echo "QEMU_PID${n}=$!" >> "$GITHUB_ENV"
          }
          start_vm 1 "${{ steps.overlays.outputs.vm_disk_1 }}" "$VM1_SSH_PORT"
          start_vm 2 "${{ steps.overlays.outputs.vm_disk_2 }}" "$VM2_SSH_PORT"
          sleep 5
          for pid in $(awk -F= '/^QEMU_PID/{print $2}' "$GITHUB_ENV"); do
            kill -0 "$pid" 2>/dev/null || { cat /tmp/qemu-vm1.log /tmp/qemu-vm2.log; exit 1; }
          done

      - name: Wait for both VMs over SSH
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            for i in $(seq 1 60); do
              ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                  -o ConnectTimeout=5 -p "$port" "${VM_USER}@localhost" true \
                2>/dev/null && break
              sleep 5
            done
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -p "$port" "${VM_USER}@localhost" echo "VM_READY on $port" || {
              cat "/tmp/qemu-vm1-console.log" "/tmp/qemu-vm2-console.log"; exit 1; }
          done

      - name: Install kernel headers and build tools in both VMs
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -p "$port" "${VM_USER}@localhost" bash -s << 'EOFVM'
          set -e
          KVER=$(uname -r)
          # A guest on a mainline kernel already has its headers from the
          # .deb, and kernel.ubuntu.com has no Packages index behind it.
          HEADER_PKG=""
          [ -d "/lib/modules/${KVER}/build" ] || HEADER_PKG="linux-headers-${KVER}"
          APT_LOCK_WAIT="-o DPkg::Lock::Timeout=300"
          for i in 1 2 3; do sudo apt-get $APT_LOCK_WAIT update -qq && break || sleep 5; done
          for i in 1 2 3 4 5; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_LOCK_WAIT install -y -qq \
              ${HEADER_PKG} dkms git build-essential cmake ninja-build \
              pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
            [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
            sleep 10
          done
          echo "Kernel packages installed for ${KVER}"
          EOFVM
          done

      - name: Provision both VMs with the ernic Ansible collection
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ERNIC_RUN_DIR=/tmp/ernic-ci
          mkdir -p "$ERNIC_RUN_DIR"
          cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
          {
            "instances": [
              { "id": 1, "vm": { "vm_name": "hipobj-2vm-1",
                                 "ssh_port": ${VM1_SSH_PORT}, "ssh_user": "${VM_USER}" } },
              { "id": 2, "vm": { "vm_name": "hipobj-2vm-2",
                                 "ssh_port": ${VM2_SSH_PORT}, "ssh_user": "${VM_USER}" } }
            ]
          }
          EOFJSON
          export ANSIBLE_HOST_KEY_CHECKING=false
          export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY"
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          ansible-playbook ci-site.yml --tags guest-setup \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_run_dir="$ERNIC_RUN_DIR" \
            -e ernic_instances=2 \
            -e ernic_vm_ssh_base_port="$VM1_SSH_PORT" \
            -e ernic_vm_ssh_user="$VM_USER" \
            -e ernic_gpu_passthrough=false \
            -e ernic_guest_agent=false \
            -e ernic_set_hostname=false

      - name: Verify the RDMA device in both VMs
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"
          for spec in "1:${VM1_SSH_PORT}" "2:${VM2_SSH_PORT}"; do
            n=${spec%%:*}; port=${spec##*:}
            # By PCI vendor ID, never by name: the kernel registers ionic_%d
            # and udev rewrites it twice.
            DEV=$(ssh $SSH_OPTS -p "$port" "${VM_USER}@localhost" 'sh -s' \
              < "${GITHUB_WORKSPACE}/rocm-ernic/scripts/find-rdma-device.sh" | tr -d '\r') || true
            [ -n "$DEV" ] || {
              echo "VM ${n}: no RDMA device"
              ssh $SSH_OPTS -p "$port" "${VM_USER}@localhost" \
                'ibv_devices; lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
              exit 1
            }
            ssh $SSH_OPTS -p "$port" "${VM_USER}@localhost" "ibv_devinfo -d $DEV" \
              | grep -q PORT_ACTIVE || { echo "VM ${n}: $DEV not PORT_ACTIVE"; exit 1; }
            echo "VM ${n}: $DEV is PORT_ACTIVE"
            echo "RDMA_DEVICE_${n}=$DEV" >> "$GITHUB_ENV"
          done

      - name: Copy hipObject binaries into both VMs
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          BUILD="${GITHUB_WORKSPACE}/ernic-build"
          for port in "$VM1_SSH_PORT" "$VM2_SSH_PORT"; do
            SCP="scp -i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no -P $port"
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -p "$port" \
              "${VM_USER}@localhost" \
              'mkdir -p /tmp/hipobject-build/test/integration/rdma-test-server /tmp/hipobject-build/examples'
            $SCP -r "${BUILD}/rocm-libs" "${VM_USER}@localhost:/tmp/hipobject-build/rocm-libs"
            $SCP "${BUILD}/test/integration/rdma-test-server/hipobj-rdma-test-server" \
                 "${BUILD}/test/integration/rdma-test-server/v2-data-client" \
                 "${VM_USER}@localhost:/tmp/hipobject-build/test/integration/rdma-test-server/"
            $SCP "${BUILD}/examples/put-object" "${BUILD}/examples/get-object" \
                 "${VM_USER}@localhost:/tmp/hipobject-build/examples/"
            $SCP ci/ernic/server-entrypoint.sh ci/ernic/client-entrypoint.sh \
                 "${VM_USER}@localhost:/tmp/hipobject-build/"
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -p "$port" \
              "${VM_USER}@localhost" 'chmod +x /tmp/hipobject-build/*.sh \
                 /tmp/hipobject-build/examples/* \
                 /tmp/hipobject-build/test/integration/rdma-test-server/*'
          done

      - name: Start hipobj-rdma-test-server in VM 1
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"
          # systemd-run, not `nohup ... &` over ssh: a backgrounded remote
          # command leaves nothing to ask about afterwards. If it dies at
          # startup the only evidence is an empty log file, which is exactly
          # how the first run of this lane failed.
          ssh $SSH_OPTS -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
            "sudo systemd-run --unit=hipobj-server \
               --setenv=HIPOBJ_NIC_HINT='${RDMA_DEVICE_1}' \
               --setenv=SERVER_PORT='${SERVER_PORT}' \
               /tmp/hipobject-build/server-entrypoint.sh"

          dump_server() {
            echo "=== VM 1: systemctl status hipobj-server ==="
            ssh $SSH_OPTS -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
              'systemctl status hipobj-server --no-pager -l || true
               sudo journalctl -u hipobj-server --no-pager | tail -60
               ss -ltnp 2>/dev/null | head -20
               ip -4 -br addr show' || true
          }

          # From VM 2, not from VM 1: the point of the probe is that the
          # listener is reachable across the emulated wire.
          for i in $(seq 1 45); do
            ssh $SSH_OPTS -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
              "timeout 2 bash -c 'echo > /dev/tcp/${VM1_ADDR}/${SERVER_PORT}'" \
              2>/dev/null && { echo "server reachable at ${VM1_ADDR}:${SERVER_PORT}"; break; }
            # No point waiting out the loop once the unit has given up.
            ssh $SSH_OPTS -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
              'systemctl is-active --quiet hipobj-server' || {
              echo "hipobj-server is no longer running"; dump_server; exit 1; }
            sleep 2
          done
          ssh $SSH_OPTS -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            "timeout 2 bash -c 'echo > /dev/tcp/${VM1_ADDR}/${SERVER_PORT}'" || {
            echo "VM 2 cannot reach the test server"
            dump_server
            exit 1
          }

      - name: Run the v2 client layers in VM 2
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -p "$VM2_SSH_PORT" "${VM_USER}@localhost" \
            "HIPOBJ_NIC_HINT='${RDMA_DEVICE_2}' \
             SERVER_ENDPOINT='http://${VM1_ADDR}:${SERVER_PORT}' \
             TEST_SIZE='${TEST_SIZE}' \
             /tmp/hipobject-build/client-entrypoint.sh"

      - name: Collect logs
        if: always()
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          for n in 1 2; do
            echo "=== server${n}.log ==="        && tail -100 "/tmp/server${n}.log"        || true
            echo "=== qemu-vm${n}.log ==="       && cat "/tmp/qemu-vm${n}.log"             || true
            echo "=== qemu-vm${n}-console ===" && tail -200 "/tmp/qemu-vm${n}-console.log" || true
          done
          echo "=== VM 1 hipobj-server journal ==="
          timeout 60 ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -p "$VM1_SSH_PORT" "${VM_USER}@localhost" \
            'sudo journalctl -u hipobj-server --no-pager | tail -100' || true

      - name: Teardown
        if: always()
        run: |
          kill "${QEMU_PID1:-}" "${QEMU_PID2:-}"   2>/dev/null || true
          kill "${ERNIC_PID1:-}" "${ERNIC_PID2:-}" 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build" 2>/dev/null || true

  ernic-minio-v1:
    name: MinIO Bridge v1 Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Make entrypoints executable
        run: |
          chmod +x ci/ernic/server-v1-entrypoint.sh \
                   ci/ernic/minio-v1-client-entrypoint.sh

      - name: Build hipObject + minio-cpp binaries (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev \
                nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target hipobj-rdma-test-server minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              export LD_LIBRARY_PATH=/opt/rocm/lib && \
              ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | awk '/=> \//{print \$3}' \
                | grep -E '^/opt/(rocm|amdgpu)|/libpugixml\.so' \
                | xargs -r -I{} cp -L {} /hipobject-build/rocm-libs/ && \
              LD_LIBRARY_PATH=/hipobject-build/rocm-libs \
                ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | grep 'not found' && { echo 'staged closure incomplete'; exit 1; } || \
                echo 'staged closure complete'
            "

      - name: Pull images
        run: |
          docker pull "$ERNIC_IMAGE"
          docker pull "$ROCJITSU_IMAGE"

      - name: Create ernic-minio bridge network and vfio socket volume
        run: |
          docker network create ernic-minio-net
          docker volume create vfio-sockets

      - name: Start rocjitsu (emulated AMD GPU)
        run: |
          docker run -d \
            --name rocjitsu \
            --network ernic-minio-net \
            -v vfio-sockets:/tmp/vfio-sockets \
            "$ROCJITSU_IMAGE" \
            rocjitsu \
              --config /usr/local/share/rocjitsu/configs/gfx950_mi355x.json \
              --vfio-socket /tmp/vfio-sockets/rocjitsu.sock

      - name: Start ernic-server-v1
        run: |
          docker run -d \
            --name ernic-server-v1 \
            --hostname ernic-server \
            --network ernic-minio-net \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            --entrypoint /hipobject/ci/ernic/server-v1-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Wait for ernic-server-v1 to be healthy
        run: |
          echo "Waiting for hipobj-rdma-test-server (v1) on port 9000..."
          for i in $(seq 1 60); do
            if docker exec ernic-server-v1 \
                bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null'; then
              echo "Server ready (attempt $i)"
              break
            fi
            sleep 2
          done
          docker exec ernic-server-v1 \
              bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null' || {
            echo "Server did not become healthy"
            docker logs ernic-server-v1
            exit 1
          }

      - name: Wait for rocjitsu socket
        run: |
          echo "Waiting for rocjitsu vfio-user socket..."
          for i in $(seq 1 30); do
            if docker run --rm \
                -v vfio-sockets:/tmp/vfio-sockets \
                busybox test -S /tmp/vfio-sockets/rocjitsu.sock; then
              echo "rocjitsu socket ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocjitsu socket did not appear"
              docker logs rocjitsu
              exit 1
            fi
            sleep 2
          done

      - name: Run ernic-minio-client
        run: |
          docker run --rm \
            --name ernic-minio-client \
            --network ernic-minio-net \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v vfio-sockets:/tmp/vfio-sockets \
            -e SERVER_ENDPOINT=http://ernic-server:9000 \
            -e TEST_SIZE=65536 \
            -e ROCJITSU_SOCKET=/tmp/vfio-sockets/rocjitsu.sock \
            --entrypoint /hipobject/ci/ernic/minio-v1-client-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Collect server-v1 logs
        if: always()
        run: docker logs ernic-server-v1 2>&1 || true

      - name: Collect rocjitsu logs
        if: always()
        run: docker logs rocjitsu 2>&1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f ernic-server-v1 rocjitsu 2>/dev/null || true
          docker network rm ernic-minio-net 2>/dev/null || true
          docker volume rm vfio-sockets 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build-v1:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build-v1" 2>/dev/null || true

  ernic-s3-backend:
    name: S3 Backend Test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Run inside the same QEMU+libvfio-user image used by rocm-ernic's
    # s3-lane: has QEMU, oras, zstd, and libvfio-user pre-installed.
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      options: --device /dev/kvm
    env:
      # Matches the rocm-ernic s3-lane guest artifact.
      GUEST_ARTIFACT_REPO: docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ernic-rocjitsu
      GUEST_ARTIFACT_TAG: 20260925.g4868a2e-vm.resolute-ernic-rocjitsu-qm.e73a1e6-qcow2
      S3_ADDR: 192.168.200.1
      S3_PORT: 9000
      SSH_PORT: 2222
      # getput-rdma hardcodes this bucket, and the backend defaults to
      # "ernic", so it has to be passed explicitly or every PUT 400s.
      S3_BUCKET: hipobj-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Checkout rocm-ernic (Ansible collection + guest driver sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ROCm/rocm-ernic
          ref: develop
          path: rocm-ernic

      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq iproute2 libibverbs1 libnl-3-200 libnl-route-3-200 \
            ansible python3-jmespath
          # Galaxy drops connections often enough to fail a lane on its own.
          for attempt in 1 2 3; do
            ansible-galaxy collection install community.general && break
            echo "::warning::galaxy install failed (attempt ${attempt}/3)"
            sleep $((attempt * 20))
          done

      - name: Build minio-getput-rdma (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build-s3:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              export LD_LIBRARY_PATH=/opt/rocm/lib && \
              ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | awk '/=> \//{print \$3}' \
                | grep -E '^/opt/(rocm|amdgpu)|/libpugixml\.so' \
                | xargs -r -I{} cp -L {} /hipobject-build/rocm-libs/ && \
              LD_LIBRARY_PATH=/hipobject-build/rocm-libs \
                ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | grep 'not found' && { echo 'staged closure incomplete'; exit 1; } || \
                echo 'staged closure complete'
            "

      - name: Extract rocm-ernic binary from ernic image
        run: |
          docker create --name ernic-tmp "$ERNIC_IMAGE"
          # Not the workspace: it is mounted noexec in the job container, so a
          # 0755 binary there still fails exec with EACCES.
          docker cp ernic-tmp:/usr/local/bin/rocm-ernic /usr/local/bin/rocm-ernic
          docker rm ernic-tmp
          chmod +x /usr/local/bin/rocm-ernic
          # No pipe here: under `sh -e` a failure in a non-final pipeline
          # element is ignored, which is how the EACCES above reached the
          # next step disguised as a missing socket.
          rocm-ernic --help > /tmp/ernic-help.txt
          head -3 /tmp/ernic-help.txt

      - name: Select QEMU accelerator and guest size
        run: |
          if [ -c /dev/kvm ] && ${QEMU_PATH:-}qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
            echo "QEMU_ACCEL=kvm"  >> "$GITHUB_ENV"
            echo "QEMU_CPU=host"   >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg"       >> "$GITHUB_ENV"
            echo "QEMU_CPU=qemu64"      >> "$GITHUB_ENV"
          fi
          HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          VM_VCPUS=$(( ($(nproc) - 1) )); [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
          VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 )); [ "$VM_MEM_MB" -gt 4096 ] && VM_MEM_MB=4096
          echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
          echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"

      - name: Fetch guest VM image
        id: guest_image
        uses: ./.github/actions/fetch-guest-vm
        with:
          repo: ${{ env.GUEST_ARTIFACT_REPO }}
          tag: ${{ env.GUEST_ARTIFACT_TAG }}

      - name: Read VM info
        id: vm_info
        run: |
          OUT="${{ steps.guest_image.outputs.output_dir }}"
          eval "$(python3 - "$OUT" <<'PYEOF'
          import json, os, shlex, sys
          out = sys.argv[1]
          d = json.load(open(os.path.join(out, "vm-info.json")))
          here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
          keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
          }
          for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
          PYEOF
          )"
          echo "vm_user=$VM_USER"         >> "$GITHUB_OUTPUT"
          echo "vm_disk=$VM_DISK"         >> "$GITHUB_OUTPUT"
          echo "ssh_key=$SSH_KEY_PRIVATE" >> "$GITHUB_OUTPUT"

      - name: Start rocm-ernic S3 backend (no tap)
        run: |
          rm -f /tmp/vfio-user-rocm-ernic.sock
          rocm-ernic \
            --socket /tmp/vfio-user-rocm-ernic.sock \
            --backend "s3:ip=${S3_ADDR},port=${S3_PORT},bucket=${S3_BUCKET}" \
            --verbose > /tmp/ernic-s3.log 2>&1 &
          echo "ERNIC_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            [ -S /tmp/vfio-user-rocm-ernic.sock ] && { chmod 666 /tmp/vfio-user-rocm-ernic.sock; echo "Server ready"; break; }
            sleep 1
          done
          [ -S /tmp/vfio-user-rocm-ernic.sock ] || { cat /tmp/ernic-s3.log; exit 1; }

      - name: Start QEMU VM
        run: |
          ${QEMU_PATH:-}qemu-system-x86_64 \
            -machine q35,accel=${QEMU_ACCEL},memory-backend=mem0 \
            -cpu ${QEMU_CPU} -smp ${VM_VCPUS} -m ${VM_MEM_MB}M \
            -object memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M \
            -nographic \
            -drive file="${{ steps.vm_info.outputs.vm_disk }}",format=qcow2,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::${SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
            -serial file:/tmp/qemu-console.log -monitor none \
            -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          echo "QEMU_PID=$QEMU_PID" >> "$GITHUB_ENV"
          sleep 5
          kill -0 "$QEMU_PID" 2>/dev/null || { cat /tmp/qemu.log; exit 1; }

      - name: Wait for VM SSH
        run: |
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          chmod 600 "$SSH_KEY"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5"
          for i in $(seq 1 60); do
            ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY 2>/dev/null && {
              echo "VM_USER=$VM_USER"   >> "$GITHUB_ENV"
              echo "SSH_KEY=$SSH_KEY"   >> "$GITHUB_ENV"
              echo "SSH_OPTS=$SSH_OPTS" >> "$GITHUB_ENV"
              break
            }
            sleep 5
          done
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY || {
            cat /tmp/qemu-console.log; exit 1
          }

      - name: Install kernel headers and build tools in VM
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -p $SSH_PORT "${VM_USER}@localhost" bash -s << 'EOFVM'
          set -e
          KVER=$(uname -r)
          # A guest on a mainline kernel already has its headers from the
          # .deb, and kernel.ubuntu.com has no Packages index behind it, so
          # asking apt for linux-headers-$(uname -r) would 404.
          HEADER_PKG=""
          if [ -d "/lib/modules/${KVER}/build" ]; then
            echo "Kernel headers already present for ${KVER}"
          else
            HEADER_PKG="linux-headers-${KVER}"
          fi
          APT_LOCK_WAIT="-o DPkg::Lock::Timeout=300"
          for i in 1 2 3; do
            sudo apt-get $APT_LOCK_WAIT update -qq && break || sleep 5
          done
          for i in 1 2 3 4 5; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_LOCK_WAIT install -y -qq \
              ${HEADER_PKG} dkms git build-essential cmake ninja-build \
              pkg-config libnl-3-dev libnl-route-3-dev libudev-dev && break
            [ "$i" -eq 5 ] && { echo "apt-get install failed after 5 attempts"; exit 1; }
            sleep 10
          done
          echo "Kernel packages installed for ${KVER}"
          EOFVM

      - name: Provision the VM with the ernic Ansible collection
        run: |
          # The guest image bakes the kernel and the rdma-core userspace but
          # NOT the ionic DKMS driver or the udev naming rules -- a pristine
          # image has no ionic module and no /sys/class/infiniband entry at
          # all. Without this step there is no RDMA device to hint at.
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ERNIC_RUN_DIR=/tmp/ernic-ci
          mkdir -p "$ERNIC_RUN_DIR"
          cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
          {
            "instances": [
              {
                "id": 1,
                "vm": {
                  "vm_name": "hipobj-s3-vm1",
                  "ssh_port": ${SSH_PORT},
                  "ssh_user": "${VM_USER}"
                }
              }
            ]
          }
          EOFJSON
          export ANSIBLE_HOST_KEY_CHECKING=false
          export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY"
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          # ernic_configure_nic is left at its default (true): without an
          # IPv4 address on the emulated NIC the guest has no route to the
          # endpoint, and ionic_rdma populates no RoCEv2 GID for the client
          # to mint into its x-amz-rdma-token.
          ansible-playbook ci-site.yml --tags guest-setup \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_run_dir="$ERNIC_RUN_DIR" \
            -e ernic_instances=1 \
            -e ernic_vm_ssh_base_port="$SSH_PORT" \
            -e ernic_vm_ssh_user="$VM_USER" \
            -e ernic_gpu_passthrough=false \
            -e ernic_guest_agent=false \
            -e ernic_set_hostname=false

      - name: Verify the RDMA device and the object store
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"

          kill -0 "$ERNIC_PID" 2>/dev/null || {
            echo "rocm-ernic (PID $ERNIC_PID) is no longer running"
            tail -30 /tmp/ernic-s3.log || true
            exit 1
          }
          # The store banner is the earliest proof the backend parsed its
          # options and came up on the address the guest will ARP for.
          grep -q "s3 bucket '${S3_BUCKET}'" /tmp/ernic-s3.log || {
            echo "Server log carries no s3 store banner for '${S3_BUCKET}'"
            grep -i s3 /tmp/ernic-s3.log || tail -40 /tmp/ernic-s3.log
            exit 1
          }
          grep -m1 "s3 bucket" /tmp/ernic-s3.log

          # By PCI vendor ID, never by name: the kernel registers ionic_%d,
          # 60-rdma-persistent-naming.rules rewrites it to rocep<bus>s<slot>,
          # then 99-rocm-ernic.rules rewrites it again to rocm-rdma-ernic<n>.
          DEVICE=$(ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" 'sh -s' \
            < "${GITHUB_WORKSPACE}/rocm-ernic/scripts/find-rdma-device.sh" | tr -d '\r') || true
          [ -n "$DEVICE" ] || {
            echo "RDMA device not found in the guest"
            ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
              'ibv_devices; lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
            exit 1
          }
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
            "ibv_devinfo -d $DEVICE" | tee /dev/stderr | grep -q PORT_ACTIVE || {
            echo "$DEVICE never reached PORT_ACTIVE"; exit 1
          }
          echo "RDMA_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "$DEVICE is PORT_ACTIVE and the object store is up"

      - name: Copy minio binary to VM
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          # In a container job, ${{ github.workspace }} resolves to the runner
          # host path but inside the container it is mounted at /__w/.
          # The minio binary was built into ernic-build-s3 which is a subdir
          # of the workspace, accessible inside the container via the same
          # relative path from GITHUB_WORKSPACE.
          MINIO_BIN="${GITHUB_WORKSPACE}/ernic-build-s3/integrations/minio-cpp/minio-getput-rdma"
          ROCM_LIBS="${GITHUB_WORKSPACE}/ernic-build-s3/rocm-libs"
          scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -P $SSH_PORT \
            "$MINIO_BIN" \
            "${VM_USER}@localhost:/tmp/minio-getput-rdma"
          # The guest has no ROCm install, so the binary's HIP runtime
          # closure (~30 MB, staged by the build step) has to travel with it.
          scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -P $SSH_PORT -r \
            "$ROCM_LIBS" \
            "${VM_USER}@localhost:/tmp/rocm-libs"

      - name: Run S3 PUT+GET test in VM
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -p $SSH_PORT "${VM_USER}@localhost" \
              "S3_ADDR='${S3_ADDR}' S3_PORT='${S3_PORT}' RDMA_DEVICE='${RDMA_DEVICE}' bash -s" << 'EOFVM'
          set -e
          chmod +x /tmp/minio-getput-rdma
          export LD_LIBRARY_PATH=/tmp/rocm-libs
          echo "=== Runtime linkage ==="
          ldd /tmp/minio-getput-rdma | grep -E 'not found' && {
            echo "ERROR: unresolved shared libraries in guest"; exit 1
          } || true
          echo "=== Waiting for the in-band S3 endpoint ==="
          ready=
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://${S3_ADDR}:${S3_PORT}/" 2>/dev/null) || code=
            case "$code" in [234]*) ready=1; break;; esac
            sleep 2
          done
          [ -n "$ready" ] || {
            echo "ERROR: S3 endpoint http://${S3_ADDR}:${S3_PORT}/ never answered"
            ip -4 -br addr show; ip route
            exit 1
          }
          echo "Endpoint answered with HTTP ${code}"
          # Without a hint hipObjInit has no GPU topology to walk in this
          # GPU-less guest, so it finds no NIC and the bridge falls back to
          # plain HTTP -- which the emulator rejects for a 64 KiB body.
          export HIPOBJ_NIC_HINT="${RDMA_DEVICE}"
          echo "=== Running minio-getput-rdma (HIPOBJ_NIC_HINT=$HIPOBJ_NIC_HINT) ==="
          /tmp/minio-getput-rdma "${S3_ADDR}:${S3_PORT}" minioadmin minioadmin 65536 nogpu
          EOFVM

      - name: Collect logs
        if: always()
        run: |
          echo "=== ernic-s3.log ===" && cat /tmp/ernic-s3.log    || true
          echo "=== qemu.log ==="     && cat /tmp/qemu.log         || true
          echo "=== qemu-console ===" && cat /tmp/qemu-console.log || true

      - name: Teardown
        if: always()
        run: |
          kill "$QEMU_PID"  2>/dev/null || true
          kill "$ERNIC_PID" 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build-s3:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build-s3" 2>/dev/null || true

  # ---------------------------------------------------------------------
  # Job 4 - ernic-rocjitsu-gpu: the GPU-direct path, in a VM.
  #
  # Everything above runs the client on host buffers. This lane attaches a
  # SECOND vfio-user function -- rocjitsu's emulated gfx1250 -- beside the
  # ernic NIC, so the same S3-over-RDMA transfer can be driven from a real
  # hipMalloc'd device buffer. That is the product claim, and this is the
  # only lane that exercises it.
  #
  # Modelled on qemu-minimal's ansible-playbook-test-ernic-rocjitsu lane,
  # with one deliberate difference: rather than baking a combined image with
  # qemu-tool gen-vm (~50 min), it starts from the published ernic-rocjitsu
  # guest artifact.
  #
  # That guest bakes everything this lane used to derive at job time:
  # mainline v7.2.4 (ionic_rdma calls ib_umem_get_va, absent before 7.2), the
  # three amdgpu DKMS patches this repo used to carry (see
  # ci/ernic/guest-image-recipe.md), the generated gfx1250 gap firmware, therock
  # ROCm 10.0 userspace, render/video group membership and an amdgpu-probe
  # helper holding the parameter set below. The prep boot -- install a
  # pinned kernel, reboot, patch and rebuild amdgpu DKMS, ~15 min every run
  # -- is gone with it, so the lane boots once, with both vfio-user
  # functions attached.
  #
  # Two hard requirements came out of that work and are reflected below.
  #
  # 1. The vfio-user servers must run in the same container/namespace as
  #    QEMU. Running rocm-ernic on the host against a containerised QEMU is
  #    what produced the handle_dma_map SIGSEGV and the double-errp abort
  #    this comment used to blame on the two-device combination. It is not a
  #    two-device bug: both functions enumerate in one guest, PORT_ACTIVE
  #    holds with the GPU attached, and amdgpu binds the device.
  #
  # 2. amdgpu needs the full emulation parameter set -- fw_load_type=0 to
  #    skip PSP, discovery=2, vm_update_mode=3, gpu_recovery=0, vramlimit
  #    and ip_block_mask=0x7f. Not 0x3f: this DKMS build enumerates an extra
  #    ras_v1_0 at index 5, so MES sits at 6, and dropping it makes
  #    gfx_v12_1_xcc_cp_resume dereference a NULL ring. The guest's
  #    /usr/local/bin/amdgpu-probe carries that set, so the lane calls it
  #    rather than restating the parameters. The gap firmware stubs are
  #    baked into the guest; ip_discovery.bin is NOT, and must come from the
  #    SAME rocjitsu build that serves the socket (ROCJITSU_IMAGE_GPU) or
  #    probe fails at -22 or -2.
  #
  # The guest also cannot be warm-rebooted with the rocjitsu function
  # attached -- the device reset wedges it. Nothing below reboots, but a
  # step that starts to is a bug, not a slow path.
  #
  # What previously parked this lane -- "amdgpu probe hangs in
  # amdgpu_ras_init -> amdgpu_atomfirmware_mem_ecc_supported" -- was neither
  # a hang nor a kernel problem. rocjitsu serves no option ROM, so
  # adev->mode_info.atom_context is NULL and the RAS VBIOS query oopses on
  # it. 0003-amdgpu-ras-guard-vbios-query fixes that; with it, plus
  # ip_block_mask=0x7f, modprobe returns 0 and KFD reports gfx_target_version
  # 120500. The probe step is still bounded at all three layers -- guest
  # command, ssh session and step -- so a regression reports instead of
  # eating the job timeout.
  # ---------------------------------------------------------------------
  ernic-rocjitsu-gpu:
    name: GPU-Direct S3 Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      options: --device /dev/kvm -v /var/run/docker.sock:/var/run/docker.sock
    env:
      # The ernic-rocjitsu guest: mainline 7.2.4 (the ionic_rdma floor), the
      # patched amdgpu-dkms, the generated gfx1250 gap firmware and therock
      # ROCm 10.0 userspace, with render/video group membership. Only
      # ip_discovery.bin is still the consumer's to stage, and it has to come
      # from the rocjitsu build serving the socket (ROCJITSU_IMAGE_GPU).
      GUEST_ARTIFACT_REPO: docker.io/sbates130272/batesste-ci-images-ubuntu-qcow2-gen-ernic-rocjitsu
      GUEST_ARTIFACT_TAG: 20260925.g4868a2e-vm.resolute-ernic-rocjitsu-qm.e73a1e6-qcow2
      S3_ADDR: 192.168.200.1
      S3_PORT: 9000
      S3_BUCKET: hipobj-test
      SSH_PORT: 2222

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Checkout rocm-ernic (Ansible collection + guest driver sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ROCm/rocm-ernic
          ref: develop
          path: rocm-ernic

      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq iproute2 libibverbs1 libnl-3-200 libnl-route-3-200 \
            ansible python3-jmespath
          for attempt in 1 2 3; do
            ansible-galaxy collection install community.general && break
            echo "::warning::galaxy install failed (attempt ${attempt}/3)"
            sleep $((attempt * 20))
          done

      - name: Build minio-getput-rdma (ROCm container)
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build-gpu:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              export LD_LIBRARY_PATH=/opt/rocm/lib && \
              ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | awk '/=> \//{print \$3}' \
                | grep -E '^/opt/(rocm|amdgpu)|/libpugixml\.so' \
                | xargs -r -I{} cp -L {} /hipobject-build/rocm-libs/ && \
              LD_LIBRARY_PATH=/hipobject-build/rocm-libs \
                ldd /hipobject-build/integrations/minio-cpp/minio-getput-rdma \
                | grep 'not found' && { echo 'staged closure incomplete'; exit 1; } || \
                echo 'staged closure complete'
            "

      - name: Extract rocm-ernic binary from ernic image
        run: |
          docker create --name ernic-tmp-gpu "$ERNIC_IMAGE"
          # Not the workspace: it is mounted noexec in the job container, so a
          # 0755 binary there still fails exec with EACCES.
          docker cp ernic-tmp-gpu:/usr/local/bin/rocm-ernic /usr/local/bin/rocm-ernic
          docker rm ernic-tmp-gpu
          chmod +x /usr/local/bin/rocm-ernic
          # No pipe here: under `sh -e` a failure in a non-final pipeline
          # element is ignored, which is how the EACCES above reached the
          # next step disguised as a missing socket.
          rocm-ernic --help > /tmp/ernic-help.txt
          head -3 /tmp/ernic-help.txt

      - name: Select QEMU accelerator and guest size
        run: |
          if [ -c /dev/kvm ] && ${QEMU_PATH:-}qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
            echo "QEMU_ACCEL=kvm" >> "$GITHUB_ENV"
            echo "QEMU_CPU=host"  >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg"  >> "$GITHUB_ENV"
            echo "QEMU_CPU=qemu64" >> "$GITHUB_ENV"
          fi
          HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          # ionic_create_rdma_admin() hard-fails below 4 online CPUs
          # (IONIC_EQ_COUNT_MIN), so 4 is a floor, not a preference.
          VM_VCPUS=$(( $(nproc) - 1 )); [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
          VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 )); [ "$VM_MEM_MB" -gt 6144 ] && VM_MEM_MB=6144
          echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
          echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"

      - name: Fetch rocjitsu guest VM image
        id: guest_image
        uses: ./.github/actions/fetch-guest-vm
        with:
          repo: ${{ env.GUEST_ARTIFACT_REPO }}
          tag: ${{ env.GUEST_ARTIFACT_TAG }}

      - name: Read VM info
        id: vm_info
        run: |
          OUT="${{ steps.guest_image.outputs.output_dir }}"
          eval "$(python3 - "$OUT" <<'PYEOF'
          import json, os, shlex, sys
          out = sys.argv[1]
          d = json.load(open(os.path.join(out, "vm-info.json")))
          here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
          keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
          }
          for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
          PYEOF
          )"
          echo "vm_user=$VM_USER"         >> "$GITHUB_OUTPUT"
          echo "vm_disk=$VM_DISK"         >> "$GITHUB_OUTPUT"
          echo "ssh_key=$SSH_KEY_PRIVATE" >> "$GITHUB_OUTPUT"

      - name: Generate ip_discovery.bin on the host
        run: |
          # The only firmware the guest does not bake, because it is the only
          # piece that is not static: it describes the device the socket
          # serves, so it must come from the rocjitsu build serving it. The
          # gap stubs are in /lib/firmware/updates/amdgpu already.
          mkdir -p "${GITHUB_WORKSPACE}/rj-fw"
          chmod 777 "${GITHUB_WORKSPACE}/rj-fw"
          docker run --rm -v "${{ github.workspace }}/rj-fw:/out" \
            "$ROCJITSU_IMAGE_GPU" \
            rj-ip-discovery gfx1250 /out/ip_discovery.bin
          ls -l "${GITHUB_WORKSPACE}/rj-fw"

      - name: Start rocm-ernic S3 backend and rocjitsu GPU server
        run: |
          # rocjitsu runs as a sibling container, so its socket has to live on
          # a path the host daemon can bind-mount AND this container can see.
          # ${{ github.workspace }} is the host path; $GITHUB_WORKSPACE is the
          # same directory as mounted in here.
          mkdir -p "${GITHUB_WORKSPACE}/vfu"
          chmod 777 "${GITHUB_WORKSPACE}/vfu"

          rocm-ernic \
            --socket "${GITHUB_WORKSPACE}/vfu/ernic.sock" \
            --backend "s3:ip=${S3_ADDR},port=${S3_PORT},bucket=${S3_BUCKET}" \
            --verbose > /tmp/ernic-s3.log 2>&1 &
          echo "ERNIC_PID=$!" >> "$GITHUB_ENV"

          docker run -d --name rocjitsu-gpu \
            -v "${{ github.workspace }}/vfu:/run/vfu" \
            "$ROCJITSU_IMAGE_GPU" \
            rocjitsu --config /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json \
                     --vfio-socket /run/vfu/rocjitsu.sock

          for i in $(seq 1 45); do
            [ -S "${GITHUB_WORKSPACE}/vfu/ernic.sock" ] && \
            [ -S "${GITHUB_WORKSPACE}/vfu/rocjitsu.sock" ] && break
            sleep 2
          done
          for s in ernic rocjitsu; do
            [ -S "${GITHUB_WORKSPACE}/vfu/${s}.sock" ] || {
              echo "${s}.sock never appeared"
              cat /tmp/ernic-s3.log || true
              docker logs rocjitsu-gpu || true
              exit 1
            }
            chmod 666 "${GITHUB_WORKSPACE}/vfu/${s}.sock" || true
          done
          echo "both vfio-user sockets present"

      - name: Start QEMU VM with both vfio-user devices
        run: |
          ${QEMU_PATH:-}qemu-system-x86_64 \
            -machine q35,accel=${QEMU_ACCEL},memory-backend=mem0 \
            -cpu ${QEMU_CPU} -smp ${VM_VCPUS} -m ${VM_MEM_MB}M \
            -object memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M \
            -nographic \
            -drive file="${{ steps.vm_info.outputs.vm_disk }}",format=qcow2,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::${SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -device '{"driver":"vfio-user-pci","rombar":0,"socket":{"type":"unix","path":"'"${GITHUB_WORKSPACE}"'/vfu/ernic.sock"}}' \
            -device '{"driver":"vfio-user-pci","rombar":0,"socket":{"type":"unix","path":"'"${GITHUB_WORKSPACE}"'/vfu/rocjitsu.sock"}}' \
            -serial file:/tmp/qemu-console.log -monitor none \
            -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          echo "QEMU_PID=$QEMU_PID" >> "$GITHUB_ENV"
          sleep 5
          kill -0 "$QEMU_PID" 2>/dev/null || { cat /tmp/qemu.log; exit 1; }

      - name: Wait for VM SSH
        run: |
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          chmod 600 "$SSH_KEY"
          for i in $(seq 1 60); do
            ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY \
              2>/dev/null && break
            sleep 5
          done
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY || {
            cat /tmp/qemu-console.log; exit 1
          }

      - name: Verify both emulated functions are present
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -p $SSH_PORT "${VM_USER}@localhost" 'lspci -nn' | tee /tmp/lspci.txt
          # 1dd8:100a is the Pensando ionic NIC; 1002: is the rocjitsu GPU.
          grep -q '1dd8:100a' /tmp/lspci.txt || {
            echo "emulated ionic NIC not enumerated"; exit 1; }
          grep -qi '1002:' /tmp/lspci.txt || {
            echo "emulated rocjitsu GPU not enumerated"; exit 1; }
          echo "both emulated PCI functions enumerated"

      - name: Provision the VM with the ernic Ansible collection
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ERNIC_RUN_DIR=/tmp/ernic-ci
          mkdir -p "$ERNIC_RUN_DIR"
          cat > "$ERNIC_RUN_DIR/instances.json" << EOFJSON
          {
            "instances": [
              {
                "id": 1,
                "vm": {
                  "vm_name": "hipobj-gpu-vm1",
                  "ssh_port": ${SSH_PORT},
                  "ssh_user": "${VM_USER}"
                }
              }
            ]
          }
          EOFJSON
          export ANSIBLE_HOST_KEY_CHECKING=false
          export ANSIBLE_PRIVATE_KEY_FILE="$SSH_KEY"
          PROJECT_ROOT="${GITHUB_WORKSPACE}/rocm-ernic"
          export ANSIBLE_ROLES_PATH="${PROJECT_ROOT}/ansible/roles"
          cd "${PROJECT_ROOT}/ansible"
          ansible-playbook ci-site.yml --tags guest-setup \
            -e ernic_project_root="$PROJECT_ROOT" \
            -e ernic_run_dir="$ERNIC_RUN_DIR" \
            -e ernic_instances=1 \
            -e ernic_vm_ssh_base_port="$SSH_PORT" \
            -e ernic_vm_ssh_user="$VM_USER" \
            -e ernic_gpu_passthrough=false \
            -e ernic_guest_agent=false \
            -e ernic_set_hostname=false

      - name: Verify the RDMA device and the object store
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"
          kill -0 "$ERNIC_PID" 2>/dev/null || {
            echo "rocm-ernic is no longer running"; tail -30 /tmp/ernic-s3.log; exit 1; }
          grep -q "s3 bucket '${S3_BUCKET}'" /tmp/ernic-s3.log || {
            echo "no s3 store banner for '${S3_BUCKET}'"
            grep -i s3 /tmp/ernic-s3.log || tail -40 /tmp/ernic-s3.log
            exit 1
          }
          DEVICE=$(ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" 'sh -s' \
            < "${GITHUB_WORKSPACE}/rocm-ernic/scripts/find-rdma-device.sh" | tr -d '\r') || true
          [ -n "$DEVICE" ] || {
            echo "RDMA device not found in the guest"
            ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
              'ibv_devices; lsmod | grep ionic; dmesg | grep -i ionic | tail -30' || true
            exit 1
          }
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
            "ibv_devinfo -d $DEVICE" | tee /dev/stderr | grep -q PORT_ACTIVE || {
            echo "$DEVICE never reached PORT_ACTIVE"; exit 1; }
          echo "RDMA_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "$DEVICE is PORT_ACTIVE"

      - name: Stage ip_discovery.bin into the guest
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"
          scp $SSH_OPTS -P $SSH_PORT "${GITHUB_WORKSPACE}/rj-fw/ip_discovery.bin" \
            "${VM_USER}@localhost:/tmp/"
          # updates/ takes precedence over the packaged firmware, and is where
          # the guest's baked gap stubs already live.
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
            'sudo install -D -m 0644 /tmp/ip_discovery.bin \
               /lib/firmware/updates/amdgpu/ip_discovery.bin && \
             ls -l /lib/firmware/updates/amdgpu/'

      - name: Load amdgpu via amdgpu-probe
        timeout-minutes: 8
        run: |
          # qemu-minimal parks its lane on this step hanging with no output.
          # Bounded at three layers so a recurrence reports instead of eating
          # the job timeout: guest-side timeout, ssh keepalive, step timeout.
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -p $SSH_PORT "${VM_USER}@localhost" \
              "sudo timeout 300 /usr/local/bin/amdgpu-probe"
          echo "amdgpu-probe completed"

      - name: Verify amdgpu loaded and a GPU KFD node is present
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no"
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" 'lsmod | grep -q amdgpu' || {
            echo "amdgpu module not loaded"; exit 1; }
          # /dev/kfd is not a valid assertion: kfd_chardev_init() creates it
          # before amdgpu_init() registers the PCI driver, so it exists even
          # when every probe failed. Node 0 is the CPU and has an empty name;
          # a bound GPU adds a named node.
          gpus=$(ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
            'cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c .')
          [ "$gpus" -ge 1 ] || {
            echo "amdgpu loaded but never bound the device"
            ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" \
              'sudo dmesg | grep -i amdgpu | tail -40' || true
            exit 1
          }
          echo "GPU KFD node present ($gpus)"

      - name: Copy minio binary to VM
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -P $SSH_PORT \
            "${GITHUB_WORKSPACE}/ernic-build-gpu/integrations/minio-cpp/minio-getput-rdma" \
            "${VM_USER}@localhost:/tmp/minio-getput-rdma"
          scp -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -P $SSH_PORT -r \
            "${GITHUB_WORKSPACE}/ernic-build-gpu/rocm-libs" \
            "${VM_USER}@localhost:/tmp/rocm-libs"

      - name: Run GPU-direct S3 PUT+GET test in VM
        run: |
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -p $SSH_PORT "${VM_USER}@localhost" \
              "S3_ADDR='${S3_ADDR}' S3_PORT='${S3_PORT}' RDMA_DEVICE='${RDMA_DEVICE}' bash -s" << 'EOFVM'
          set -e
          chmod +x /tmp/minio-getput-rdma
          export LD_LIBRARY_PATH=/tmp/rocm-libs
          ldd /tmp/minio-getput-rdma | grep -E 'not found' && {
            echo "ERROR: unresolved shared libraries in guest"; exit 1; } || true
          echo "=== Waiting for the in-band S3 endpoint ==="
          ready=
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://${S3_ADDR}:${S3_PORT}/" 2>/dev/null) || code=
            case "$code" in [234]*) ready=1; break;; esac
            sleep 2
          done
          [ -n "$ready" ] || {
            echo "ERROR: S3 endpoint never answered"; ip -4 -br addr show; exit 1; }
          export HIPOBJ_NIC_HINT="${RDMA_DEVICE}"
          echo "=== KFD access ==="
          id
          ls -l /dev/kfd /dev/dri/ 2>&1 || true
          # Run it as root. The KFD node comes up (this step is gated on that)
          # but /dev/kfd and /dev/dri/render* are root:render 0660 and the
          # guest's login user is in neither group, so the HIP runtime
          # enumerates no agent and hipMalloc returns 100, hipErrorNoDevice.
          #
          # "gpu", not "nogpu": the payload is a hipMalloc'd device buffer, so
          # this is the GPU-direct path rather than a host-buffer transfer.
          echo "=== minio-getput-rdma, GPU buffer (NIC $HIPOBJ_NIC_HINT) ==="
          sudo env LD_LIBRARY_PATH=/tmp/rocm-libs \
              HIPOBJ_NIC_HINT="$HIPOBJ_NIC_HINT" \
              /tmp/minio-getput-rdma "${S3_ADDR}:${S3_PORT}" \
              minioadmin minioadmin 65536 gpu || {
            rc=$?
            echo "=== HIP saw no device; agent enumeration ==="
            command -v rocminfo > /dev/null && \
              sudo env LD_LIBRARY_PATH=/tmp/rocm-libs rocminfo 2>&1 | head -40
            sudo dmesg | grep -i 'kfd\|amdgpu' | tail -20 || true
            exit "$rc"
          }
          EOFVM

      - name: Collect logs
        if: always()
        run: |
          echo "=== ernic-s3.log ==="  && cat /tmp/ernic-s3.log     || true
          echo "=== rocjitsu ==="      && docker logs rocjitsu-gpu   || true
          echo "=== qemu.log ==="      && cat /tmp/qemu.log          || true
          echo "=== qemu-console ==="  && cat /tmp/qemu-console.log  || true
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          timeout 60 ssh -i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 -p $SSH_PORT "${VM_USER}@localhost" \
            'sudo dmesg | tail -200' || true

      - name: Teardown
        if: always()
        run: |
          kill "${QEMU_PID:-}"  2>/dev/null || true
          kill "${ERNIC_PID:-}" 2>/dev/null || true
          docker rm -f rocjitsu-gpu 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build-gpu:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build-gpu" \
                 "${GITHUB_WORKSPACE}/vfu" "${GITHUB_WORKSPACE}/rj-fw" 2>/dev/null || true
