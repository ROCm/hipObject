name: hipObject docs check

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'include/**/*.h'
      - 'README.md'
      - '.github/workflows/hipobject-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'include/**/*.h'
      - 'README.md'
      - '.github/workflows/hipobject-docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sphinx:
    name: sphinx-build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake doxygen
        pip install -r requirements.txt
    - name: Configure docs-only build
      run: |
        cmake -S . -B build \
          -DHIPOBJ_DOCS_ONLY=ON \
          -DHIPOBJ_BUILD_DOCS=ON
    - name: Build documentation
      run: cmake --build build --target sphinx-html

  rst-lint:
    name: rst-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install doc8
      run: pip install doc8
    - name: Lint RST files
      run: doc8 docs/ --max-line-length 80
