# Validates Ansible layout on stock GitHub runners. Full site.yml is not
# executed here: batesste rocm_setup / rdma_setup and GPU S3 smoke tests need
# bare-metal lab hosts.
name: Ansible Check

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-validate:
    name: Galaxy, syntax-check, ansible-lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible-core>=2.16,<2.19" "ansible-lint>=24.2.0"

      - name: Install Galaxy collection (batesste)
        run: |
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Syntax-check orchestrated playbooks
        run: |
          ansible-playbook --syntax-check playbooks/site.yml \
            -i inventory/hosts.example.yml
          ansible-playbook --syntax-check playbooks/minio_rdma_server.yml \
            -i inventory/hosts.example.yml
          ansible-playbook --syntax-check playbooks/hipobj_client.yml \
            -i inventory/hosts.example.yml
          ansible-playbook --syntax-check playbooks/hipobj_smoke_test.yml \
            -i inventory/hosts.example.yml

      - name: ansible-lint
        run: |
          ansible-lint -v playbooks/ group_vars/ inventory/
