name: hipObject - Build

on:
  # The one lane that also fires post-merge: it is the cheapest thing that
  # compiles the tree, so it is the canary for a develop that no single PR
  # was tested against.
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-24.04:10.0.0-full
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
      # The full ROCm image ships libamdhip64 in /opt/rocm/lib but leaves it out
      # of the loader cache, so ctest binaries fail to start without this.
      LD_LIBRARY_PATH: /opt/rocm/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            git \
            libcurl4-openssl-dev \
            libibverbs-dev \
            libnuma-dev \
            libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build && ctest --output-on-failure
