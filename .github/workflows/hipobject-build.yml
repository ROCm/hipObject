name: hipObject - Build

on:
  # Pull requests, pushes to develop, and manual runs. The push run
  # catches a develop that no single PR was tested against.
  #
  # The excluded paths hold nothing this build compiles or runs: ansible/
  # and ci/ belong to their own lanes, the documentation inputs are only
  # used with HIPOBJ_BUILD_DOCS, which is OFF here (the Documentation
  # Check lane configures and builds those), the .clang-tidy files only
  # configure the clang-tidy lane, and .github/ holds the other
  # workflows and their configuration. This workflow's own file, and the
  # action that installs ROCm, are added back last; a later pattern
  # overrides an earlier one, which is why this is a paths list with
  # negations and not paths-ignore, which can't add a path back.
  pull_request:
    branches: [develop]
    paths: &paths
      - '**'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/.clang-tidy'
      - '!ansible/**'
      - '!ci/**'
      - '!cmake/HIPOBJDocumentation.cmake'
      - '!docs/**'
      - '!requirements.txt'
      - '!.github/**'
      - '.github/workflows/hipobject-build.yml'
      - '.github/actions/install-rocm/**'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Let every job finish so a failure in one doesn't hide the state of
      # the others.
      fail-fast: false
      # The jobs are listed one by one rather than made by crossing axes,
      # since most of them change one thing from the first job, and
      # crossing would build combinations nobody needs. Every job sets
      # label, ubuntu, and build_type. A job that leaves out one of the
      # other keys gets its default:
      #
      #   cc, cxx       ROCm's amdclang and amdclang++
      #   shared_libs   ON. TheRock only builds shared libraries.
      #   sanitizer     None. asan is HIPOBJ_USE_SANITIZERS (ASan, UBSan,
      #                 and the compiler's other checks), and tsan is
      #                 HIPOBJ_USE_THREAD_SANITIZER.
      #   coverage      OFF
      #   cxx_standard  20
      #   backends      ON, which turns on both HIPOBJ_BNXT and
      #                 HIPOBJ_IONIC
      #   packages      None. Extra apt packages, such as a compiler.
      #   valgrind      OFF. ON runs the tests again under valgrind's
      #                 memcheck, which needs the valgrind package.
      #
      # Every job uses ROCm 10.1, the latest ROCm (see Install ROCm below).
      matrix:
        include:
          # The core jobs build with ROCm's amdclang on the newest Ubuntu
          # release, as TheRock will build hipObject.
          - label: amdclang, RelWithDebInfo
            ubuntu: '26.04'
            build_type: RelWithDebInfo
          # Debug, so the library's assert()s are checked with the
          # sanitizers on, and the reports aren't muddied by optimization
          - label: amdclang, Debug, ASan and UBSan
            ubuntu: '26.04'
            build_type: Debug
            sanitizer: asan
          # RelWithDebInfo, as TheRock's ThreadSanitizer builds are, so the
          # threads' timing is closer to a normal build's
          - label: amdclang, RelWithDebInfo, TSan
            ubuntu: '26.04'
            build_type: RelWithDebInfo
            sanitizer: tsan
          # Debug, so the report's lines match the source. Coverage needs
          # Clang.
          - label: amdclang, Debug, coverage
            ubuntu: '26.04'
            build_type: Debug
            coverage: ON
          # Smoke tests of what the core jobs don't build. Release is
          # TheRock's default build type.
          - label: amdclang, Release, static
            ubuntu: '26.04'
            build_type: Release
            shared_libs: OFF
          - label: amdclang, no NIC backends
            ubuntu: '26.04'
            build_type: RelWithDebInfo
            backends: OFF
          - label: amdclang, C++23
            ubuntu: '26.04'
            build_type: RelWithDebInfo
            cxx_standard: 23
          # C++26 needs CMake 3.30 or later, which Ubuntu 24.04 doesn't have
          - label: amdclang, C++26
            ubuntu: '26.04'
            build_type: RelWithDebInfo
            cxx_standard: 26
          # Upstream Clang, the version Ubuntu installs as clang
          - label: Clang 21
            ubuntu: '26.04'
            cc: clang-21
            cxx: clang++-21
            build_type: RelWithDebInfo
            packages: clang-21
          # GCC is a second set of eyes: its warnings and sanitizers find
          # problems that Clang's don't. The sanitizer job builds
          # RelWithDebInfo, since the amdclang one builds Debug.
          #
          # The plain GCC job also runs the tests under valgrind, which
          # finds reads of uninitialized memory that the sanitizers don't
          # look for. It can't run in a Clang job: with
          # -ftrivial-auto-var-init=pattern, which hipObject's Clang
          # options add, optimized Clang code copies std::format()'s
          # arguments with x87 instructions, which valgrind emulates with
          # too few bits (see test/valgrind.supp). It can't run in a
          # sanitizer job either, since valgrind can't run a program built
          # with ASan or TSan.
          - label: GCC 15
            ubuntu: '26.04'
            cc: gcc-15
            cxx: g++-15
            build_type: RelWithDebInfo
            packages: valgrind
            valgrind: ON
          - label: GCC 15, ASan and UBSan
            ubuntu: '26.04'
            cc: gcc-15
            cxx: g++-15
            build_type: RelWithDebInfo
            sanitizer: asan
          # The oldest supported Ubuntu release, with older compilers and
          # an older CMake (3.28)
          - label: Ubuntu 24.04, GCC 13
            ubuntu: '24.04'
            cc: gcc-13
            cxx: g++-13
            build_type: RelWithDebInfo
          - label: Ubuntu 24.04, Clang 18
            ubuntu: '24.04'
            cc: clang-18
            cxx: clang++-18
            build_type: RelWithDebInfo
            packages: clang-18
    # A plain Ubuntu image, with only the ROCm that hipObject needs
    # installed (see Install ROCm below)
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --user root
    env:
      # Packages such as tzdata ask questions when they're installed into a
      # plain image; this takes their defaults instead.
      DEBIAN_FRONTEND: noninteractive
      # The tests that load the system's libibverbs fail, rather than skip,
      # if it doesn't load (see test/unit/require-libibverbs.h)
      HIPOBJ_TEST_REQUIRE_LIBIBVERBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-essential is the release's GCC (GCC 15 on 26.04, GCC 13 on
      # 24.04) and make. amdclang uses GCC's libstdc++ too.
      #
      # rpm provides rpmbuild, so hipObject can build RPM packages here
      # as well as DEB packages, and the RPM package test runs.
      #
      # The MinIO bridge needs nlohmann-json3-dev, libpugixml-dev, and
      # zlib1g-dev. libcurlpp-dev saves downloading and building curlpp.
      #
      # A job's packages (EXTRA_PACKAGES) are separated by spaces, so read
      # splits them into an array with one package in each element.
      - name: Install dependencies
        env:
          EXTRA_PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra extra_packages <<< "${EXTRA_PACKAGES}"
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            git \
            libcurl4-openssl-dev \
            libcurlpp-dev \
            libibverbs-dev \
            libpugixml-dev \
            libssl-dev \
            nlohmann-json3-dev \
            rpm \
            zlib1g-dev \
            "${extra_packages[@]}"

      # After the compilers, so the libstdc++ that ROCm's compiler
      # packages need is the one already installed
      - name: Install ROCm
        uses: ./.github/actions/install-rocm
        with:
          version: '10.1'

      # HIPOBJ_WERROR makes a new warning fail the build. It only
      # covers hipObject's own targets, not the code FetchContent pulls in.
      #
      # Every job but the coverage job builds the MinIO bridge, so it's
      # compiled with each compiler's warnings and ctest's install and
      # package tests include it. The coverage report only measures src/,
      # so the bridge would only slow that job down.
      #
      # CMake picks the compilers up from CC and CXX. A job that doesn't
      # set them gets amdclang, which is in ROCm's directory.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          export CC="${CC:-${ROCM_PATH}/llvm/bin/amdclang}"
          export CXX="${CXX:-${ROCM_PATH}/llvm/bin/amdclang++}"
          cmake -B build \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_WERROR=ON \
            -DHIPOBJ_BNXT=${{ matrix.backends || 'ON' }} \
            -DHIPOBJ_IONIC=${{ matrix.backends || 'ON' }} \
            -DHIPOBJ_MINIO_CLIENT=${{ matrix.coverage == 'ON' && 'OFF' || 'ON' }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared_libs || 'ON' }} \
            -DHIPOBJ_CXX_STANDARD=${{ matrix.cxx_standard || '20' }} \
            -DHIPOBJ_USE_SANITIZERS=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }} \
            -DHIPOBJ_USE_THREAD_SANITIZER=${{ matrix.sanitizer == 'tsan' && 'ON' || 'OFF' }} \
            -DHIPOBJ_USE_CODE_COVERAGE=${{ matrix.coverage || 'OFF' }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          cd build && ctest --output-on-failure -j"$(nproc)"

      # Runs the test programs under valgrind's memcheck. Valgrind makes a
      # test fail if it finds an error, such as a read of uninitialized
      # memory or of memory that isn't allocated, or a leak that's
      # definitely or possibly lost. It doesn't report memory that's still
      # reachable at exit, such as the HIP runtime's, so this doesn't need
      # test/valgrind.supp.
      #
      # The excluded tests run CMake scripts, so valgrind would only check
      # CMake. Valgrind writes its reports to a log for each test, not to
      # ctest's output, so the logs of the tests with a report are printed
      # here.
      - name: Test with valgrind
        if: matrix.valgrind == 'ON'
        run: |
          status=0
          ctest --test-dir build -T memcheck --output-on-failure --no-tests=error -j"$(nproc)" \
            --overwrite "MemoryCheckCommand=$(command -v valgrind)" \
            --overwrite "MemoryCheckCommandOptions=--leak-check=full --track-origins=yes --num-callers=40 --error-exitcode=1" \
            -E '^hipobj-(exports|subproject|install|package-deb|package-rpm)$' \
            || status=$?
          shopt -s nullglob
          for log in build/Testing/Temporary/MemoryChecker.*.log; do
            if ! grep -q 'ERROR SUMMARY: 0 errors' "${log}"; then
              echo "::error::valgrind reported errors in ${log}"
              cat "${log}"
            fi
          done
          exit "${status}"

      # hipObject has to load libibverbs with only its runtime package
      # (libibverbs1) installed, not the development package that the
      # build needs, whose libibverbs.so link a user may not have. Remove
      # the development package and run the tests that load libibverbs
      # again. The coverage job skips this, since running tests again would
      # add to its coverage.
      - name: Test with only libibverbs' runtime package
        if: matrix.coverage != 'ON'
        run: |
          link=$(dpkg -L libibverbs-dev | grep '/libibverbs\.so$')
          apt-get remove -y libibverbs-dev
          if [[ -e "${link}" ]]; then
            echo "::error::${link} is still there"
            exit 1
          fi
          dpkg -s libibverbs1 > /dev/null
          cd build && ctest --output-on-failure --no-tests=error \
            -R '^(test-ibv-lazy-load|test-loaded-verbs|test-seams)$'

      # The report's summary goes on the run's summary page. The job fails
      # if the library's line coverage is below the target in AGENTS.md.
      # It also writes the line coverage to build/coverage/coverage.json,
      # in the format of a shields.io endpoint badge, which the
      # publish-coverage-badge job publishes for the README's badge.
      - name: Code coverage report
        if: matrix.coverage == 'ON'
        env:
          MIN_LINE_COVERAGE: 90
        run: |
          cmake --build build --target hipobj-coverage
          {
            echo '# Code coverage'
            echo '```'
            cat build/coverage/report.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # The TOTAL line's tenth field is the line coverage, e.g. 90.17%
          awk -v min="${MIN_LINE_COVERAGE}" \
            -v badge=build/coverage/coverage.json '
            $1 == "TOTAL" { lines = $10 }
            END {
              if (lines == "") {
                print "::error::No TOTAL line in the coverage report"
                exit 1
              }
              sub(/%$/, "", lines)
              if (lines !~ /^[0-9]+(\.[0-9]+)?$/) {
                printf "::error::Bad line coverage in the report: %s\n", lines
                exit 1
              }
              # Coverage below the target fails the job, so the badge is
              # never published with it and keeps the last passing value.
              color = lines + 0 >= 90 ? "brightgreen" : "yellowgreen"
              printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%s%%\",\"color\":\"%s\"}\n", \
                lines, color > badge
              close(badge)
              if (lines + 0 < min) {
                printf "::error::Line coverage is %s%%, below the %s%% target\n", lines, min
                exit 1
              }
              printf "Line coverage is %s%% (target %s%%)\n", lines, min
            }' build/coverage/report.txt

      # Only develop's coverage goes on the badge, not a pull request's or
      # another branch's.
      - name: Upload coverage badge data
        if: >-
          matrix.coverage == 'ON' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: build/coverage/coverage.json
          if-no-files-found: error
          retention-days: 1

  # Publish develop's line coverage for the README's Coverage badge, which
  # shields.io draws from coverage.json on the badges branch. That branch
  # holds a single commit with only that file, replaced on every run, so
  # it never grows. This is a separate job so that the token that can push
  # to the repository is never present while the repository's code runs;
  # this job only copies the build job's JSON into the branch. It runs
  # only when every build job passes, so the badge shows the coverage of
  # the latest develop commit that passed.
  publish-coverage-badge:
    name: Publish Coverage Badge
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch
    # One publish at a time. A newer pending run replaces an older one.
    concurrency:
      group: ${{ github.workflow }}-publish-coverage-badge
      cancel-in-progress: false
    steps:
      # Only for a repository to push from: nothing in the checkout runs.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # "Publish to badges" pushes through origin with this token.
          persist-credentials: true
      # Outside the workspace, so it can't land in either worktree.
      - name: Download coverage badge data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge
      - name: Publish to badges
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgSign false

          git worktree add --quiet --orphan -b badges ../badges
          cp "${RUNNER_TEMP}/coverage-badge/coverage.json" ../badges/
          git -C ../badges add coverage.json
          git -C ../badges commit --quiet \
            -m "Coverage badge from ${GITHUB_SHA}" \
            -m "Published by hipobject-build.yml. [skip ci]"
          git -C ../badges push --quiet --force origin HEAD:refs/heads/badges
          echo "published: $(cat ../badges/coverage.json)"
