name: hipObject compile and test

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-24.04:7.2
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            git \
            libcurl4-openssl-dev \
            libibverbs-dev \
            libnuma-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build && ctest --output-on-failure
