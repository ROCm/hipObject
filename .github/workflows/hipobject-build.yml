name: hipObject - Build

on:
  # The one lane that also fires post-merge: it is the cheapest thing that
  # compiles the tree, so it is the canary for a develop that no single PR
  # was tested against.
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  build:
    name: >-
      Build (V2 API ${{ matrix.v2_api }},
      ${{ matrix.shared_libs == 'ON' && 'shared' || 'static' }}${{ matrix.sanitizers == 'ON' && ', ASan' || '' }})
    runs-on: ubuntu-latest
    strategy:
      # Every other workflow builds the default configuration (V2 API on,
      # shared library, no sanitizers), so this is the only place the V2-off,
      # static, and sanitizer configurations get compiled and tested. Let
      # every job finish so a failure in one doesn't hide the state of the
      # others.
      fail-fast: false
      matrix:
        v2_api: [ON, OFF]
        shared_libs: [ON, OFF]
        sanitizers: [OFF]
        include:
          # One AddressSanitizer job (HIPOBJ_SANITIZER_TYPE defaults to
          # address) with the default configuration
          - v2_api: ON
            shared_libs: ON
            sanitizers: ON
    container:
      image: rocm/dev-ubuntu-24.04:10.0.0-full
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
      # The full ROCm image ships libamdhip64 in /opt/rocm/lib but leaves it out
      # of the loader cache, so ctest binaries fail to start without this.
      LD_LIBRARY_PATH: /opt/rocm/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rpm provides rpmbuild, so hipObject can build RPM packages here
      # as well as DEB packages, and the RPM package test runs
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            git \
            libcurl4-openssl-dev \
            libibverbs-dev \
            libnuma-dev \
            libssl-dev \
            rpm

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON \
            -DHIPOBJECT_V2_API=${{ matrix.v2_api }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }} \
            -DHIPOBJ_USE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          cd build && ctest --output-on-failure
