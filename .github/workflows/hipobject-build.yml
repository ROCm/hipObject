name: hipObject - Build

on:
  # Pull requests, pushes to develop, and manual runs. The push run
  # catches a develop that no single PR was tested against.
  #
  # The excluded paths hold nothing this build compiles or runs: ansible/
  # and ci/ belong to their own lanes, the documentation inputs are only
  # used with HIPOBJ_BUILD_DOCS, which is OFF here (the Documentation
  # Check lane configures and builds those), and .github/ holds the other
  # workflows and their configuration. The thread-safety checker's Python
  # files are excluded too: ctest runs the checker and its self-test, but
  # so does the pylint workflow, which runs for any change to them. A
  # change to what the checker reads (hipobj.h, hipobj.cpp) still runs
  # this build. This workflow's own file is added back last; a later
  # pattern overrides an earlier one, which is why this is a paths list
  # with negations and not paths-ignore, which can't add a path back.
  pull_request:
    branches: [develop]
    paths: &paths
      - '**'
      - '!**/*.md'
      - '!**/*.rst'
      - '!ansible/**'
      - '!ci/**'
      - '!cmake/HIPOBJDocumentation.cmake'
      - '!docs/**'
      - '!requirements.txt'
      - '!test/thread-safety/*.py'
      - '!.github/**'
      - '.github/workflows/hipobject-build.yml'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  build:
    name: >-
      Build (V2 API ${{ matrix.v2_api }},
      ${{ matrix.shared_libs == 'ON' && 'shared' || 'static' }}${{ matrix.sanitizers == 'ON' && ', ASan' || '' }}${{ matrix.coverage == 'ON' && ', coverage' || '' }}${{ matrix.build_type && format(', {0}', matrix.build_type) || '' }})
    runs-on: ubuntu-latest
    strategy:
      # Every other workflow builds the default configuration (V2 API on,
      # shared library, no sanitizers), so this is the only place the V2-off,
      # static, sanitizer, and code coverage configurations get compiled and
      # tested. Let every job finish so a failure in one doesn't hide the
      # state of the others.
      fail-fast: false
      matrix:
        v2_api: [ON, OFF]
        shared_libs: [ON, OFF]
        sanitizers: [OFF]
        coverage: [OFF]
        # Empty means the CMakeLists.txt default (RelWithDebInfo)
        build_type: ['']
        include:
          # One AddressSanitizer job (HIPOBJ_SANITIZER_TYPE defaults to
          # address) with the default configuration. It builds Debug, so
          # it's also the one place the library's assert()s are checked,
          # and sanitizer reports aren't muddied by optimization.
          - v2_api: ON
            shared_libs: ON
            sanitizers: ON
            coverage: OFF
            build_type: Debug
          # One code coverage job with the default configuration. Coverage
          # needs Clang, so it builds with ROCm's, which makes it the one
          # job that doesn't use GCC. It builds Debug, so the report's
          # lines match the source.
          - v2_api: ON
            shared_libs: ON
            sanitizers: OFF
            coverage: ON
            build_type: Debug
            cc: /opt/rocm/llvm/bin/amdclang
            cxx: /opt/rocm/llvm/bin/amdclang++
    container:
      image: rocm/dev-ubuntu-24.04:10.0.0-full
      options: --user root
    env:
      ROCM_PATH: /opt/rocm
      # The full ROCm image ships libamdhip64 in /opt/rocm/lib but leaves it out
      # of the loader cache, so ctest binaries fail to start without this.
      LD_LIBRARY_PATH: /opt/rocm/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rpm provides rpmbuild, so hipObject can build RPM packages here
      # as well as DEB packages, and the RPM package test runs
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            git \
            libcurl4-openssl-dev \
            libibverbs-dev \
            libnuma-dev \
            libssl-dev \
            rpm

      # HIPOBJ_WERROR makes a new warning fail the build. It only
      # covers hipObject's own targets, not the code FetchContent pulls in.
      #
      # CMake picks the compilers up from CC and CXX, and ignores them when
      # they're empty, as they are for the jobs that don't set cc and cxx.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DBUILD_TESTING=ON \
            -DHIPOBJ_WERROR=ON \
            -DHIPOBJ_BNXT=ON \
            -DHIPOBJ_IONIC=ON \
            -DHIPOBJECT_V2_API=${{ matrix.v2_api }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }} \
            -DHIPOBJ_USE_SANITIZERS=${{ matrix.sanitizers }} \
            -DHIPOBJ_USE_CODE_COVERAGE=${{ matrix.coverage }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          cd build && ctest --output-on-failure

      # The report's summary goes on the run's summary page. The job fails
      # if the library's line coverage is below the target in AGENTS.md.
      - name: Code coverage report
        if: matrix.coverage == 'ON'
        env:
          MIN_LINE_COVERAGE: 80
        run: |
          cmake --build build --target hipobj-coverage
          {
            echo '# Code coverage'
            echo '```'
            cat build/coverage/report.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # The TOTAL line's tenth field is the line coverage, e.g. 90.17%
          awk -v min="${MIN_LINE_COVERAGE}" '
            $1 == "TOTAL" { lines = $10 }
            END {
              if (lines == "") {
                print "::error::No TOTAL line in the coverage report"
                exit 1
              }
              sub(/%$/, "", lines)
              if (lines + 0 < min) {
                printf "::error::Line coverage is %s%%, below the %s%% target\n", lines, min
                exit 1
              }
              printf "Line coverage is %s%% (target %s%%)\n", lines, min
            }' build/coverage/report.txt
