#
# Two-container ernic integration test.
#
# ernic-server: ubuntu-rocm-ernic image running rocm-ernic (emulated
#   Pensando/ionic NIC) + hipobj-rdma-test-server on port 9000.
# ernic-client: same image, builds hipobject with HIPOBJ_IONIC=ON
#   and runs put-object / get-object against the server.
#
# GPU slot: when an emulated GPU runner is available, add
#   --device /dev/kfd --device /dev/dri to the client compose service
#   and drop the HIPOBJ_DOCS_ONLY guard on the GPU-path tests.

name: eRNIC Integration Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "examples/**"
      - "ci/ernic/**"
      - ".github/workflows/ernic-integration-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "examples/**"
      - "ci/ernic/**"
      - ".github/workflows/ernic-integration-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to a specific date-stamped tag produced by batesste-ci-images.
  # Bump this intentionally when the ernic image is updated.
  ERNIC_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-ernic:aug-26-2026

jobs:
  ernic-integration:
    name: rocm-ernic two-container test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make entrypoints executable
        run: chmod +x ci/ernic/server-entrypoint.sh ci/ernic/client-entrypoint.sh

      - name: Pull ernic image
        run: docker pull "$ERNIC_IMAGE"

      - name: Create ernic bridge network
        run: docker network create ernic-net

      - name: Start ernic-server
        run: |
          docker run -d \
            --name ernic-server \
            --hostname ernic-server \
            --network ernic-net \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v ernic-build-server:/hipobject-build-server \
            -e ROCM_PATH=/opt/rocm \
            --entrypoint /hipobject/ci/ernic/server-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Wait for ernic-server to be healthy
        run: |
          echo "Waiting for hipobj-rdma-test-server on port 9000..."
          for i in $(seq 1 60); do
            if docker exec ernic-server \
                curl -sf http://localhost:9000/health >/dev/null 2>&1; then
              echo "Server ready (attempt $i)"
              break
            fi
            sleep 2
          done
          docker exec ernic-server \
              curl -sf http://localhost:9000/health || {
            echo "Server did not become healthy"
            docker logs ernic-server
            exit 1
          }

      - name: Run ernic-client
        run: |
          docker run --rm \
            --name ernic-client \
            --network ernic-net \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v ernic-build-client:/hipobject-build-client \
            -e ROCM_PATH=/opt/rocm \
            -e SERVER_ENDPOINT=http://ernic-server:9000 \
            -e TEST_SIZE=1048576 \
            --entrypoint /hipobject/ci/ernic/client-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Collect server logs
        if: always()
        run: docker logs ernic-server 2>&1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f ernic-server 2>/dev/null || true
          docker network rm ernic-net 2>/dev/null || true
          docker volume rm ernic-build-server ernic-build-client 2>/dev/null || true
