#
# Two-container ernic integration tests.  rocm-ernic provides a
# software-emulated Pensando/ionic NIC; transfers are functionally
# equivalent to real RDMA hardware.
#
# Job 1 - ernic-integration (v2 protocol):
#   ernic-server: hipobj-rdma-test-server --v2 on port 9000.
#   ernic-client: put-object/get-object/v2-data-client;
#     Layer 2 (control-plane) and Layer 3 (data-plane, payload verified).
#
# Job 2 - ernic-minio-v1 (v1 protocol, minio-cpp bridge, hipobj-rdma-test-server):
#   ernic-server-v1: hipobj-rdma-test-server (v1 mode) on port 9000.
#   rocjitsu:        rocjitsu GPU emulator serving a vfio-user socket via a
#                    shared tmpfs volume (wired for future GPU path; client
#                    currently runs in nogpu mode — /dev/kfd + /dev/dri not
#                    present in Docker without vfio-pci passthrough).
#   ernic-minio-client: minio-getput-rdma in nogpu+HTTP-only mode;
#                    payload integrity verified end-to-end.
#
# Job 3 - ernic-s3-backend (rocm-ernic --backend s3, single container):
#   A single privileged ernic container creates a TAP interface, starts
#   rocm-ernic in S3 backend mode, and runs minio-getput-rdma against it.
#   Tests the built-in rocm-ernic S3-over-RDMA server end-to-end.

name: eRNIC Integration Check

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "examples/**"
      - "integrations/**"
      - "ci/ernic/**"
      - ".github/workflows/ernic-integration-check.yml"
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "examples/**"
      - "integrations/**"
      - "ci/ernic/**"
      - ".github/workflows/ernic-integration-check.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump these intentionally when the ernic or rocjitsu images are updated.
  # ERNIC_IMAGE_IONIC: september-17-2026-ionic adds rdma-core 64.0 provider,
  #   libdrm2, libdrm-amdgpu1, libnuma1, libpugixml1v5 — needed by minio-v1
  #   and s3-backend jobs.
  # ERNIC_IMAGE_LATEST: commit 6ca9a465, adds --backend s3/nvmeof/tap — used
  #   by the v2 two-container job.
  ERNIC_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-ernic:september-17-2026-ionic
  ERNIC_IMAGE_LATEST: sbates130272/batesste-ci-images-ubuntu-rocm-ernic:latest
  ROCJITSU_IMAGE: sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:august-28-2026
  ROCM_IMAGE: rocm/dev-ubuntu-24.04:7.14.0-full

jobs:
  ernic-integration:
    name: rocm-ernic two-container test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Make entrypoints executable
        run: |
          chmod +x ci/ernic/server-entrypoint.sh \
                   ci/ernic/client-entrypoint.sh

      - name: Build hipObject binaries (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev libcurl4-openssl-dev libssl-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=OFF \
                -DHIPOBJ_BUILD_DOCS=OFF && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target hipobj-rdma-test-server put-object get-object \
                        v2-data-client && \
              mkdir -p /hipobject-build/rocm-libs && \
              find /opt/rocm -name '*.so*' \( -type f -o -type l \) \
                -exec cp -P {} /hipobject-build/rocm-libs/ \; 2>/dev/null || true && \
              echo "=== missing after copy ===" && \
              LD_LIBRARY_PATH=/hipobject-build/rocm-libs \
                ldd /hipobject-build/test/integration/rdma-test-server/hipobj-rdma-test-server \
                2>&1 | grep "not found" || echo "none missing"
            "

      - name: Pull ernic image
        run: docker pull "$ERNIC_IMAGE"

      - name: Create ernic bridge network
        run: docker network create ernic-net

      - name: Start ernic-server
        run: |
          docker run -d \
            --name ernic-server \
            --hostname ernic-server \
            --network ernic-net \
            -v "${{ github.workspace }}/ernic-build:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            --entrypoint /hipobject/ci/ernic/server-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Wait for ernic-server to be healthy
        run: |
          echo "Waiting for hipobj-rdma-test-server on port 9000..."
          for i in $(seq 1 60); do
            if docker exec ernic-server \
                bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null'; then
              echo "Server ready (attempt $i)"
              break
            fi
            sleep 2
          done
          docker exec ernic-server \
              bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null' || {
            echo "Server did not become healthy"
            docker logs ernic-server
            exit 1
          }

      - name: Run ernic-client
        run: |
          docker run --rm \
            --name ernic-client \
            --network ernic-net \
            -v "${{ github.workspace }}/ernic-build:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -e SERVER_ENDPOINT=http://ernic-server:9000 \
            -e TEST_SIZE=1048576 \
            --entrypoint /hipobject/ci/ernic/client-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Collect server logs
        if: always()
        run: docker logs ernic-server 2>&1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f ernic-server 2>/dev/null || true
          docker network rm ernic-net 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build" 2>/dev/null || true

  ernic-minio-v1:
    name: rocm-ernic minio-cpp bridge v1 test (rocjitsu GPU)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Make entrypoints executable
        run: |
          chmod +x ci/ernic/server-v1-entrypoint.sh \
                   ci/ernic/minio-v1-client-entrypoint.sh

      - name: Build hipObject + minio-cpp binaries (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev \
                nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target hipobj-rdma-test-server minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              find /opt/rocm -name '*.so*' \( -type f -o -type l \) \
                -exec cp -P {} /hipobject-build/rocm-libs/ \; 2>/dev/null || true
            "

      - name: Pull images
        run: |
          docker pull "$ERNIC_IMAGE"
          docker pull "$ROCJITSU_IMAGE"

      - name: Create ernic-minio bridge network and vfio socket volume
        run: |
          docker network create ernic-minio-net
          docker volume create vfio-sockets

      - name: Start rocjitsu (emulated AMD GPU)
        run: |
          docker run -d \
            --name rocjitsu \
            --network ernic-minio-net \
            -v vfio-sockets:/tmp/vfio-sockets \
            "$ROCJITSU_IMAGE" \
            rocjitsu \
              --config /usr/local/share/rocjitsu/configs/gfx950_mi355x.json \
              --vfio-socket /tmp/vfio-sockets/rocjitsu.sock

      - name: Start ernic-server-v1
        run: |
          docker run -d \
            --name ernic-server-v1 \
            --hostname ernic-server \
            --network ernic-minio-net \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            --entrypoint /hipobject/ci/ernic/server-v1-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Wait for ernic-server-v1 to be healthy
        run: |
          echo "Waiting for hipobj-rdma-test-server (v1) on port 9000..."
          for i in $(seq 1 60); do
            if docker exec ernic-server-v1 \
                bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null'; then
              echo "Server ready (attempt $i)"
              break
            fi
            sleep 2
          done
          docker exec ernic-server-v1 \
              bash -c '(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null' || {
            echo "Server did not become healthy"
            docker logs ernic-server-v1
            exit 1
          }

      - name: Wait for rocjitsu socket
        run: |
          echo "Waiting for rocjitsu vfio-user socket..."
          for i in $(seq 1 30); do
            if docker run --rm \
                -v vfio-sockets:/tmp/vfio-sockets \
                busybox test -S /tmp/vfio-sockets/rocjitsu.sock; then
              echo "rocjitsu socket ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocjitsu socket did not appear"
              docker logs rocjitsu
              exit 1
            fi
            sleep 2
          done

      - name: Run ernic-minio-client
        run: |
          docker run --rm \
            --name ernic-minio-client \
            --network ernic-minio-net \
            -v "${{ github.workspace }}/ernic-build-v1:/hipobject-build:ro" \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v vfio-sockets:/tmp/vfio-sockets \
            -e SERVER_ENDPOINT=http://ernic-server:9000 \
            -e TEST_SIZE=65536 \
            -e ROCJITSU_SOCKET=/tmp/vfio-sockets/rocjitsu.sock \
            --entrypoint /hipobject/ci/ernic/minio-v1-client-entrypoint.sh \
            "$ERNIC_IMAGE"

      - name: Collect server-v1 logs
        if: always()
        run: docker logs ernic-server-v1 2>&1 || true

      - name: Collect rocjitsu logs
        if: always()
        run: docker logs rocjitsu 2>&1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f ernic-server-v1 rocjitsu 2>/dev/null || true
          docker network rm ernic-minio-net 2>/dev/null || true
          docker volume rm vfio-sockets 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build-v1:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build-v1" 2>/dev/null || true

  ernic-s3-backend:
    name: rocm-ernic S3 backend test
    runs-on: ubuntu-24.04
    # Run inside the same QEMU+libvfio-user image used by rocm-ernic's
    # s3-lane: has QEMU, oras, zstd, and libvfio-user pre-installed.
    container:
      image: sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest
      options: --device /dev/kvm
    env:
      # Matches the rocm-ernic s3-lane guest artifact.
      GUEST_ARTIFACT_TAG: 20260916.g2cc8e79-vm.resolute-ionic-qm.5d68689-qcow2
      S3_ADDR: 192.168.200.1
      S3_PORT: 9000
      SSH_PORT: 2222

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install deps
        run: apt-get update -qq && apt-get install -y -qq iproute2 libibverbs1 libnl-3-200 libnl-route-3-200

      - name: Build minio-getput-rdma (ROCm container)
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/hipobject:ro" \
            -v "${{ github.workspace }}/ernic-build-s3:/hipobject-build" \
            -e ROCM_PATH=/opt/rocm \
            "$ROCM_IMAGE" \
            bash -c "
              apt-get update -qq && \
              apt-get install -y -qq git cmake ninja-build libibverbs-dev libnuma-dev \
                libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libpugixml-dev && \
              cmake -B /hipobject-build -G Ninja -S /hipobject \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang \
                -DBUILD_TESTING=ON \
                -DHIPOBJ_IONIC=ON \
                -DHIPOBJ_BNXT=OFF \
                -DHIPOBJ_INTEGRATION_TESTS=ON \
                -DHIPOBJ_MINIO_CLIENT=ON \
                -DHIPOBJ_BUILD_DOCS=OFF \
                -DCMAKE_SKIP_INSTALL_RULES=ON && \
              cmake --build /hipobject-build --parallel \$(nproc) \
                --target minio-getput-rdma && \
              mkdir -p /hipobject-build/rocm-libs && \
              find /opt/rocm -name '*.so*' \( -type f -o -type l \) \
                -exec cp -P {} /hipobject-build/rocm-libs/ \; 2>/dev/null || true
            "

      - name: Extract rocm-ernic binary from ernic image
        run: |
          docker create --name ernic-tmp "$ERNIC_IMAGE_LATEST"
          docker cp ernic-tmp:/usr/local/bin/rocm-ernic ./rocm-ernic
          docker rm ernic-tmp
          chmod +x ./rocm-ernic
          ./rocm-ernic --help | head -3

      - name: Select QEMU accelerator and guest size
        run: |
          if [ -c /dev/kvm ] && ${QEMU_PATH:-}qemu-system-x86_64 -accel help 2>/dev/null | grep -qw kvm; then
            echo "QEMU_ACCEL=kvm"  >> "$GITHUB_ENV"
            echo "QEMU_CPU=host"   >> "$GITHUB_ENV"
          else
            echo "QEMU_ACCEL=tcg"       >> "$GITHUB_ENV"
            echo "QEMU_CPU=qemu64"      >> "$GITHUB_ENV"
          fi
          HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          VM_VCPUS=$(( ($(nproc) - 1) )); [ "$VM_VCPUS" -lt 4 ] && VM_VCPUS=4
          VM_MEM_MB=$(( HOST_MEM_MB * 3 / 4 )); [ "$VM_MEM_MB" -gt 8192 ] && VM_MEM_MB=8192
          echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
          echo "VM_MEM_MB=$VM_MEM_MB" >> "$GITHUB_ENV"

      - name: Fetch guest VM image
        id: guest_image
        uses: ./.github/actions/fetch-guest-vm
        with:
          tag: ${{ env.GUEST_ARTIFACT_TAG }}

      - name: Read VM info
        id: vm_info
        run: |
          OUT="${{ steps.guest_image.outputs.output_dir }}"
          eval "$(python3 - "$OUT" <<'PYEOF'
          import json, os, shlex, sys
          out = sys.argv[1]
          d = json.load(open(os.path.join(out, "vm-info.json")))
          here = lambda p: os.path.join(out, os.path.basename(p)) if p else ""
          keys = {
            "VM_USER": d.get("username", "ci"),
            "VM_DISK": here(d.get("image_path", "")),
            "SSH_KEY_PRIVATE": here(d.get("ssh_keys", {}).get("private_key_path", "")),
          }
          for k, v in keys.items():
            print(f"{k}={shlex.quote(str(v))}")
          PYEOF
          )"
          echo "vm_user=$VM_USER"         >> "$GITHUB_OUTPUT"
          echo "vm_disk=$VM_DISK"         >> "$GITHUB_OUTPUT"
          echo "ssh_key=$SSH_KEY_PRIVATE" >> "$GITHUB_OUTPUT"

      - name: Start rocm-ernic S3 backend (no tap)
        run: |
          rm -f /tmp/vfio-user-rocm-ernic.sock
          ./rocm-ernic \
            --socket /tmp/vfio-user-rocm-ernic.sock \
            --backend "s3:ip=${S3_ADDR},port=${S3_PORT}" \
            --verbose > /tmp/ernic-s3.log 2>&1 &
          echo "ERNIC_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            [ -S /tmp/vfio-user-rocm-ernic.sock ] && { chmod 666 /tmp/vfio-user-rocm-ernic.sock; echo "Server ready"; break; }
            sleep 1
          done
          [ -S /tmp/vfio-user-rocm-ernic.sock ] || { cat /tmp/ernic-s3.log; exit 1; }

      - name: Start QEMU VM
        run: |
          ${QEMU_PATH:-}qemu-system-x86_64 \
            -machine q35,accel=${QEMU_ACCEL},memory-backend=mem0 \
            -cpu ${QEMU_CPU} -smp ${VM_VCPUS} -m ${VM_MEM_MB}M \
            -object memory-backend-memfd,id=mem0,share=on,size=${VM_MEM_MB}M \
            -nographic \
            -drive file="${{ steps.vm_info.outputs.vm_disk }}",format=qcow2,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::${SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -device '{"driver":"vfio-user-pci","socket":{"type":"unix","path":"/tmp/vfio-user-rocm-ernic.sock"}}' \
            -serial file:/tmp/qemu-console.log -monitor none \
            -qmp unix:/tmp/qmp.sock,server=on,wait=off > /tmp/qemu.log 2>&1 &
          echo "QEMU_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          kill -0 "$QEMU_PID" 2>/dev/null || { cat /tmp/qemu.log; exit 1; }

      - name: Wait for VM SSH
        run: |
          VM_USER="${{ steps.vm_info.outputs.vm_user }}"
          SSH_KEY="${{ steps.vm_info.outputs.ssh_key }}"
          chmod 600 "$SSH_KEY"
          SSH_OPTS="-i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5"
          for i in $(seq 1 60); do
            ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY 2>/dev/null && {
              echo "VM_USER=$VM_USER"   >> "$GITHUB_ENV"
              echo "SSH_KEY=$SSH_KEY"   >> "$GITHUB_ENV"
              echo "SSH_OPTS=$SSH_OPTS" >> "$GITHUB_ENV"
              break
            }
            sleep 5
          done
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" echo VM_READY || {
            cat /tmp/qemu-console.log; exit 1
          }

      - name: Copy minio binary to VM
        run: |
          scp $SSH_OPTS -P $SSH_PORT \
            "${{ github.workspace }}/ernic-build-s3/integrations/minio-cpp/minio-getput-rdma" \
            "${VM_USER}@localhost:/tmp/minio-getput-rdma"

      - name: Run S3 PUT+GET test in VM
        run: |
          ssh $SSH_OPTS -p $SSH_PORT "${VM_USER}@localhost" bash -s << 'EOFVM'
          set -e
          chmod +x /tmp/minio-getput-rdma
          echo "=== Waiting for ernic NIC and S3 endpoint ==="
          for i in $(seq 1 30); do
            curl -sf "http://192.168.200.1:9000/" -o /dev/null -w "%{http_code}" 2>/dev/null | \
              grep -qE '^[2-4]' && break
            sleep 2
          done
          echo "=== Running minio-getput-rdma ==="
          /tmp/minio-getput-rdma 192.168.200.1:9000 minioadmin minioadmin 65536 nogpu
          EOFVM

      - name: Collect logs
        if: always()
        run: |
          cat /tmp/ernic-s3.log    || true
          cat /tmp/qemu-console.log || true

      - name: Teardown
        if: always()
        run: |
          kill "$QEMU_PID"  2>/dev/null || true
          kill "$ERNIC_PID" 2>/dev/null || true
          docker run --rm -v "${{ github.workspace }}/ernic-build-s3:/d" \
            busybox sh -c "rm -rf /d/*" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/ernic-build-s3" 2>/dev/null || true
