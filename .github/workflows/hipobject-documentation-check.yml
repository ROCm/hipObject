name: hipObject - Documentation Check

on:
  pull_request:
    branches: [develop]
    paths: &paths
      - 'docs/**'
      - 'include/**/*.h'
      - 'README.md'
      - 'requirements.txt'
      - 'cmake/HIPOBJDocumentation.cmake'
      - '.github/workflows/hipobject-documentation-check.yml'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

# A newer commit on a pull request cancels the run for the older one.
# Every other run (a push, a manual run) gets a group of its own: in a
# shared group, a newer run replaces a pending one even without
# cancel-in-progress, which would leave a commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step uses bash, including in container jobs, where the runner
# would otherwise pick sh. "bash -e {0}" and not "bash": the bare name adds
# -o pipefail, which these scripts are not written for.
defaults:
  run:
    shell: bash -e {0}

jobs:
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake doxygen
    - name: Configure docs-only build
      run: |
        cmake -S . -B build \
          -DHIPOBJ_DOCS_ONLY=ON \
          -DHIPOBJ_BUILD_DOCS=ON
    - name: Build documentation
      run: cmake --build build --target sphinx-html

  rst-lint:
    name: RST Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install doc8
      run: pip install doc8
    - name: Lint RST files
      run: doc8 docs/ --max-line-length 80
