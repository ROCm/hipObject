#
# Two-container ernic integration tests.
#
# Neither profile here does RDMA, and cannot: rocm-ernic serves an emulated
# PCI function over vfio-user, and it takes a guest kernel's ionic/ionic_rdma
# drivers to turn that into a verbs device. In a container
# /sys/class/infiniband stays empty and the bridge falls back to plain HTTP,
# so both profiles pass EXPECT_TRANSPORT=http and assert that path honestly.
# The RDMA topologies live in the hipobject-hardware-test-*.yml CI lanes,
# which boot guests; run-local.sh mirrors them.
#
# Default profile (v1 protocol, run here as two containers):
#   ernic-server: rocm-ernic loopback + hipobj-rdma-test-server on port 9000.
#   ernic-client: minio-getput-rdma in nogpu mode, HTTP fallback.
#
# minio-v1 profile (v1 protocol, minio-cpp bridge):
#   ernic-server-v1: rocm-ernic loopback + hipobj-rdma-test-server (v1 mode).
#   rocjitsu:        rocjitsu GPU emulator serving a vfio-user socket on the
#                    shared vfio-sockets volume.  Provides /dev/kfd + /dev/dri
#                    to the client container via the emulated GFX device.
#   ernic-minio-client: rocm-ernic loopback + minio-getput-rdma in gpu or nogpu
#                    mode depending on whether the rocjitsu socket is present.
#
# Usage:
#   docker compose up                          # v1 test
#   docker compose --profile minio-v1 up      # v1 minio-cpp test with rocjitsu

services:
  # ── v1 protocol (default) ──────────────────────────────────────────────────

  ernic-server:
    image: ${ERNIC_IMAGE:-sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244}
    container_name: ernic-server
    hostname: ernic-server
    expose:
      - "9000"
    volumes:
      - hipobj-src:/hipobject:ro
      - ernic-build-server:/hipobject-build
    environment:
      ROCM_PATH: /opt/rocm
    entrypoint: ["/bin/bash", "/hipobject/ci/ernic/server-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - ernic-net

  ernic-client:
    image: ${ERNIC_IMAGE:-sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244}
    container_name: ernic-client
    depends_on:
      ernic-server:
        condition: service_healthy
    volumes:
      - hipobj-src:/hipobject:ro
      - ernic-build-client:/hipobject-build
    environment:
      ROCM_PATH: /opt/rocm
      SERVER_ENDPOINT: http://ernic-server:9000
      TEST_SIZE: "1048576"
      START_ERNIC: "true"
      EXPECT_TRANSPORT: http
    entrypoint: ["/bin/bash", "/hipobject/ci/ernic/client-entrypoint.sh"]
    networks:
      - ernic-net

  # ── v1 minio-cpp profile ───────────────────────────────────────────────────

  ernic-server-v1:
    profiles: [minio-v1]
    image: ${ERNIC_IMAGE:-sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244}
    container_name: ernic-server-v1
    hostname: ernic-server
    expose:
      - "9000"
    volumes:
      - hipobj-src:/hipobject:ro
      - ernic-build-server-v1:/hipobject-build
    environment:
      ROCM_PATH: /opt/rocm
    entrypoint: ["/bin/bash", "/hipobject/ci/ernic/server-v1-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - ernic-minio-net

  rocjitsu:
    profiles: [minio-v1]
    image: ${ROCJITSU_IMAGE:-sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260924.gad7a357-rocjitsu.c85bb75}
    container_name: rocjitsu
    # Expose the emulated GFX device via a vfio-user socket on the shared volume.
    # The client container picks it up via ROCJITSU_SOCKET.
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/${ROCJITSU_CONFIG:-gfx950_mi355x.json}
      - --vfio-socket
      - /tmp/vfio-sockets/rocjitsu.sock
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    networks:
      - ernic-minio-net

  ernic-minio-client:
    profiles: [minio-v1]
    image: ${ERNIC_IMAGE:-sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260922.g555f601-ernic.0b48aa1-vfu.8039244}
    container_name: ernic-minio-client
    depends_on:
      ernic-server-v1:
        condition: service_healthy
      rocjitsu:
        condition: service_started
    volumes:
      - hipobj-src:/hipobject:ro
      - ernic-build-client-v1:/hipobject-build
      - vfio-sockets:/tmp/vfio-sockets
    environment:
      ROCM_PATH: /opt/rocm
      SERVER_ENDPOINT: http://ernic-server:9000
      TEST_SIZE: "65536"
      ROCJITSU_SOCKET: /tmp/vfio-sockets/rocjitsu.sock
      ROCJITSU_CONFIG: ${ROCJITSU_CONFIG:-gfx950_mi355x.json}
      START_ERNIC: "true"
      EXPECT_TRANSPORT: http
    entrypoint: ["/bin/bash", "/hipobject/ci/ernic/minio-v1-client-entrypoint.sh"]
    networks:
      - ernic-minio-net

volumes:
  hipobj-src:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HIPOBJ_SRC:-./../..}
  ernic-build-server:
  ernic-build-client:
  ernic-build-server-v1:
  ernic-build-client-v1:
  vfio-sockets:

networks:
  ernic-net:
  ernic-minio-net:
