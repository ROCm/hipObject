hipobj_repo_url: https://github.com/ROCm/hipObject.git
hipobj_repo_version: main
hipobj_source_dir: "{{ ansible_env.HOME }}/Projects/hipobject"
hipobj_build_dir: "{{ hipobj_source_dir }}/build-ansible"
hipobj_install_prefix: /opt/hipobject
hipobj_do_install: false

hipobj_cmake_build_type: Release
hipobj_cmake_hipobj_bnxt: "ON"
hipobj_cmake_hipobj_ionic: "OFF"

# Smoke test object size in bytes (see integrations/minio-cpp/TESTING.md).
hipobj_test_size: "10485760"

# sbates130272.batesste.rocm_setup: account that receives ROCm groups/config.
hipobj_rocm_setup_user: "{{ ansible_user | default('root') }}"

# Less disruptive client provisioning (override in inventory if needed).
rocm_setup_skip_system_upgrade: true
rocm_setup_run_checks: false
rocm_setup_install_metrics_exporter: false

rdma_setup_motd: false
rdma_setup_install_rdma_exporter: false

# MinIO Client binary, not the Ubuntu "mc" APT package (Midnight Commander).
# dl.min.io returns HTTP 410 for its binaries, so this is the GitHub release
# asset that hipobject-minio-integration-check.yml uses. MinIO stopped
# attaching assets to releases after this one. If you override the URL, for
# a mirror, override the checksum too, or set it to "" to skip the check.
hipobj_minio_mc_release: RELEASE.2025-08-13T08-35-41Z
hipobj_minio_mc_download_url: "https://github.com/minio/mc/releases/download/\
  {{ hipobj_minio_mc_release }}/mc.linux-amd64.{{ hipobj_minio_mc_release }}"
hipobj_minio_mc_install_path: /usr/local/bin/mc
hipobj_minio_mc_checksum: "sha256:01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
